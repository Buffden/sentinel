name: CI

# Runs on every PR and on pushes to the two long-lived branches.
on:
  pull_request:
  push:
    branches:
      - main
      - docs/vision-plan

# Cancel in-progress runs on the same ref so stale runs don't hold runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

# ── Stage 1: Change detection ──────────────────────────────────────────────
#
# Each service job is conditional on its paths changing. This prevents
# unrelated services from running their quality gates on every commit.
# Infra changes (docker-compose, migrations) trigger all service checks
# because they may affect runtime behavior even if service code is unchanged.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      dashboard: ${{ steps.filter.outputs.dashboard }}
      api: ${{ steps.filter.outputs.api }}
      position-consumer: ${{ steps.filter.outputs.position-consumer }}
      alert-evaluator: ${{ steps.filter.outputs.alert-evaluator }}
      ingestion-poller: ${{ steps.filter.outputs.ingestion-poller }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history required so dorny/paths-filter can diff the base
          # commit on push events (default fetch-depth:1 may miss the base).
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dashboard:
              - 'services/dashboard/**'
            api:
              - 'services/api/**'
            position-consumer:
              - 'services/position-consumer/**'
            alert-evaluator:
              - 'services/alert-evaluator/**'
            ingestion-poller:
              - 'services/ingestion-poller/**'
            infra:
              - 'docker-compose.yml'
              - 'infra/**'

# ── Stage 2: Quality gates (parallel) ─────────────────────────────────────
#
# Each service runs independently. The dashboard is the only service with
# a build step because Next.js compilation catches import and RSC errors
# that tsc --noEmit does not.
#
# Backend services run tsc --noEmit only. No automated tests exist yet —
# add a 'test' step here when the first test suite lands.
#
# npm cache: backend services have no package-lock.json yet, so
# actions/setup-node's built-in npm cache cannot be used (it requires a
# lockfile). A manual actions/cache step keyed on package.json is used
# instead. Commit package-lock.json files and switch to:
#   cache: npm
#   cache-dependency-path: services/<name>/package-lock.json
# for fully reproducible installs.

  check-dashboard:
    name: "Dashboard: lint / typecheck / build"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v5

      # pnpm/action-setup must run before actions/setup-node so the
      # pnpm cache path is registered before setup-node reads it.
      - uses: pnpm/action-setup@v4
        with:
          # Pinned to match packageManager field in services/dashboard/package.json.
          version: 11.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: services/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Placeholders for NEXT_PUBLIC_ vars inlined at build time.
          # Real values are injected at runtime on the deployment host.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  check-api:
    name: "API: typecheck"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-${{ runner.os }}-${{ hashFiles('services/api/package.json') }}
          restore-keys: npm-api-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-position-consumer:
    name: "Position Consumer: typecheck"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.position-consumer == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: services/position-consumer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-position-consumer-${{ runner.os }}-${{ hashFiles('services/position-consumer/package.json') }}
          restore-keys: npm-position-consumer-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-alert-evaluator:
    name: "Alert Evaluator: typecheck"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.alert-evaluator == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: services/alert-evaluator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-alert-evaluator-${{ runner.os }}-${{ hashFiles('services/alert-evaluator/package.json') }}
          restore-keys: npm-alert-evaluator-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-ingestion-poller:
    name: "Ingestion Poller: typecheck"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.ingestion-poller == 'true' || needs.changes.outputs.infra == 'true'
    defaults:
      run:
        working-directory: services/ingestion-poller
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-ingestion-poller-${{ runner.os }}-${{ hashFiles('services/ingestion-poller/package.json') }}
          restore-keys: npm-ingestion-poller-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

# ── Stage 3: Required gate ─────────────────────────────────────────────────
#
# Single job required by branch protection. Always runs regardless of which
# upstream jobs were skipped — a skipped service is not a failure.
# Add this job name to the "Required status checks" rule in GitHub settings.

  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs:
      - changes
      - check-dashboard
      - check-api
      - check-position-consumer
      - check-alert-evaluator
      - check-ingestion-poller
    if: always()
    steps:
      - name: Check all quality gates
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE '\b(failure|cancelled)\b'; then
            echo "One or more quality gates failed."
            exit 1
          fi
          echo "All gates passed or were skipped."

