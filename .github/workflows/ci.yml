name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/vision-plan

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  check-dashboard:
    name: "Dashboard: typecheck / lint / build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: services/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  check-api:
    name: "API: typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-${{ runner.os }}-${{ hashFiles('services/api/package.json') }}
          restore-keys: npm-api-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-position-consumer:
    name: "Position Consumer: typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/position-consumer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-position-consumer-${{ runner.os }}-${{ hashFiles('services/position-consumer/package.json') }}
          restore-keys: npm-position-consumer-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-alert-evaluator:
    name: "Alert Evaluator: typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/alert-evaluator
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-alert-evaluator-${{ runner.os }}-${{ hashFiles('services/alert-evaluator/package.json') }}
          restore-keys: npm-alert-evaluator-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  check-ingestion-poller:
    name: "Ingestion Poller: typecheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-poller
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-ingestion-poller-${{ runner.os }}-${{ hashFiles('services/ingestion-poller/package.json') }}
          restore-keys: npm-ingestion-poller-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit

  # All service jobs must pass for this job to succeed.
  # Add "CI pass" as the required status check in branch protection settings.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs:
      - check-dashboard
      - check-api
      - check-position-consumer
      - check-alert-evaluator
      - check-ingestion-poller
    steps:
      - run: echo "All checks passed."

