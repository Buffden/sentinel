name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - docs/vision-plan

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check-dashboard:
    name: "Dashboard: typecheck / lint / test / build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: services/dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder
          NEXT_PUBLIC_WS_URL: ws://localhost:3000

  check-api:
    name: "API: typecheck / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    # alertSink's idempotent-persist integration test asserts on a real
    # Postgres primary-key conflict and a real Redis pub/sub publish — see
    # alertSink.integration.test.ts. Ports here (5433/6379) must match what
    # vitest.config.ts hardcodes: vitest's `test.env` overrides shell-provided
    # env vars, so a job-level env override would be silently ignored.
    #
    # neo4j (Phase 09 CP4): entities.integration.test.ts's GET
    # /entities/:entity_id/graph suite seeds and reads real PROXIMITY_EVENT/
    # KNOWN_ASSOCIATE edges. This was missing entirely when CP4 first shipped
    # a real Neo4j dependency to the API service — those tests could only
    # ever fail in CI (ServiceUnavailable, nothing listening on 7687), never
    # actually verified here despite passing locally against `make up`.
    # config.ts's own defaults (bolt://localhost:7687, neo4j/sentinel-dev)
    # already match this without any extra env vars needed. No schema/
    # constraint application here (infra/neo4j/apply-schema.sh assumes a
    # docker-compose container name this services: block doesn't give us) —
    # the graph read tests use randomUUID()-based ids and plain MERGE, which
    # works correctly with or without the uniqueness constraints; nothing
    # here exercises the constraint itself.
    services:
      timescaledb:
        image: timescale/timescaledb:2.15.3-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-dev
          POSTGRES_DB: sentinel
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.19.0-community
        env:
          NEO4J_AUTH: neo4j/sentinel-dev
        ports:
          - 7687:7687
          - 7474:7474
        # cypher-shell (bundled in the image), not an HTTP check: Neo4j's
        # HTTP port can report ready before Bolt (7687, what neo4j-driver
        # actually connects to) accepts connections -- the exact race
        # infra/neo4j/apply-schema.sh already documents and works around
        # locally. This health check exercises Bolt + auth directly, the
        # same thing the tests themselves depend on.
        options: >-
          --health-cmd "cypher-shell -u neo4j -p sentinel-dev 'RETURN 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-api-${{ runner.os }}-${{ hashFiles('services/api/package.json') }}
          restore-keys: npm-api-${{ runner.os }}-

      # Pre-CP5B added real Kafka/Redpanda integration tests to this suite
      # (alertSink.integration.test.ts's startAlertSink consumer-loop tests).
      # GitHub Actions' `services:` block cannot pass Redpanda's required
      # start args (dev-container mode, listener config), so it's started
      # manually here, the same proven block check-alert-evaluator already
      # uses, mirroring docker-compose.yml's redpanda service.
      - name: Start Redpanda and provision the alerts topic
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 -p 9644:9644 \
            docker.redpanda.com/redpandadata/redpanda:v24.1.2 \
            redpanda start --mode dev-container --smp 1 --memory 512M \
            --reserve-memory 0M --overprovisioned --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092 \
            --rpc-addr 0.0.0.0:33145 --advertise-rpc-addr localhost:33145

          echo "Waiting for Redpanda..."
          for i in $(seq 1 20); do
            docker exec redpanda rpk cluster info > /dev/null 2>&1 && break
            if [ "$i" -eq 20 ]; then
              echo "Redpanda did not become ready in time"
              exit 1
            fi
            sleep 3
          done

          docker exec redpanda rpk topic create alerts --partitions 1 --replicas 1

      - name: Apply database migrations
        run: |
          for f in ../../infra/migrations/[0-9]*.sql; do
            echo "--> $f"
            PGPASSWORD=sentinel-dev psql -h localhost -p 5433 -U sentinel -d sentinel -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

  check-position-consumer:
    name: "Position Consumer: typecheck / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/position-consumer
    # The idempotency/monotonicity integration tests assert on real Postgres
    # unique-constraint and Redis Lua-script behavior, not mocks — see
    # consumer.integration.test.ts. That needs real service containers.
    services:
      timescaledb:
        image: timescale/timescaledb:2.15.3-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel-dev
          POSTGRES_DB: sentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel -d sentinel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://sentinel:sentinel-dev@localhost:5432/sentinel
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-position-consumer-${{ runner.os }}-${{ hashFiles('services/position-consumer/package.json') }}
          restore-keys: npm-position-consumer-${{ runner.os }}-

      - name: Apply database migrations
        run: |
          for f in ../../infra/migrations/[0-9]*.sql; do
            echo "--> $f"
            PGPASSWORD=sentinel-dev psql -h localhost -p 5432 -U sentinel -d sentinel -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

  check-alert-evaluator:
    name: "Alert Evaluator: typecheck / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/alert-evaluator
    # The SIGNAL_LOSS episode-idempotency integration tests assert on a real
    # Redis EXISTS/HSET gate and a real message landing on the `alerts` Kafka
    # topic — see evaluator.integration.test.ts. That needs real services.
    services:
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9092
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-alert-evaluator-${{ runner.os }}-${{ hashFiles('services/alert-evaluator/package.json') }}
          restore-keys: npm-alert-evaluator-${{ runner.os }}-

      # Redpanda's official image needs explicit start args (dev-container mode,
      # listener config) that GitHub Actions' `services:` block cannot pass —
      # it only supports image/env/ports/options, not a command override.
      # Started manually here, mirroring docker-compose.yml's redpanda service
      # (internal-network listener dropped: nothing in CI needs to reach it via
      # a redpanda: hostname, only localhost).
      - name: Start Redpanda and provision the alerts topic
        run: |
          docker run -d --name redpanda \
            -p 9092:9092 -p 9644:9644 \
            docker.redpanda.com/redpandadata/redpanda:v24.1.2 \
            redpanda start --mode dev-container --smp 1 --memory 512M \
            --reserve-memory 0M --overprovisioned --node-id 0 --check=false \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr PLAINTEXT://localhost:9092 \
            --rpc-addr 0.0.0.0:33145 --advertise-rpc-addr localhost:33145

          echo "Waiting for Redpanda..."
          for i in $(seq 1 20); do
            docker exec redpanda rpk cluster info > /dev/null 2>&1 && break
            if [ "$i" -eq 20 ]; then
              echo "Redpanda did not become ready in time"
              exit 1
            fi
            sleep 3
          done

          docker exec redpanda rpk topic create alerts --partitions 1 --replicas 1

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

  check-ingestion-poller:
    name: "Ingestion Poller: typecheck / test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingestion-poller
    # The coordinator lease tests run the real compare-and-renew and
    # compare-and-delete Lua scripts, so they need a real Redis.
    # See coordinatorLease.integration.test.ts.
    services:
      redis:
        image: redis:7.2.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-ingestion-poller-${{ runner.os }}-${{ hashFiles('services/ingestion-poller/package.json') }}
          restore-keys: npm-ingestion-poller-${{ runner.os }}-

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (with coverage)
        run: npm run test:coverage

  # All service jobs must pass for this job to succeed.
  # Add "CI pass" as the required status check in branch protection settings.
  ci-pass:
    name: CI pass
    runs-on: ubuntu-latest
    needs:
      - check-dashboard
      - check-api
      - check-position-consumer
      - check-alert-evaluator
      - check-ingestion-poller
    steps:
      - run: echo "All checks passed."

