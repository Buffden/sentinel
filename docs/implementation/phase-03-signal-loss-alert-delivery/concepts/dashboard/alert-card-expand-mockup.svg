<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="920" height="620" fill="#0a0a0a"/>

  <!-- ===== Column 1: collapsed list (current state, unchanged) ===== -->
  <text x="24" y="28" fill="#a0a0a0" font-size="13" font-weight="700">COLLAPSED (default — same as today, plus a chevron)</text>

  <g transform="translate(24,44)">
    <rect width="420" height="620" fill="#111111" stroke="#1e1e1e"/>

    <!-- card 1 -->
    <rect x="0" y="0" width="420" height="56" fill="#111111"/>
    <rect x="0" y="0" width="3" height="56" fill="#f59e0b"/>
    <text x="16" y="24" fill="#e0e0e0" font-size="12" font-weight="600">407c0b</text>
    <text x="404" y="24" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="42" fill="#606060" font-size="11">Dark since 03:10 UTC</text>
    <text x="404" y="42" fill="#606060" font-size="12" text-anchor="end">▸</text>
    <line x1="0" y1="56" x2="420" y2="56" stroke="#1e1e1e"/>

    <!-- card 2 -->
    <rect x="0" y="56" width="420" height="56" fill="#111111"/>
    <rect x="0" y="56" width="3" height="56" fill="#f59e0b"/>
    <text x="16" y="80" fill="#e0e0e0" font-size="12" font-weight="600">427c0b</text>
    <text x="404" y="80" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="98" fill="#606060" font-size="11">Dark since 03:09 UTC</text>
    <text x="404" y="98" fill="#606060" font-size="12" text-anchor="end">▸</text>
    <line x1="0" y1="112" x2="420" y2="112" stroke="#1e1e1e"/>

    <!-- card 3 (hover affordance) -->
    <rect x="0" y="112" width="420" height="56" fill="#1a1a1a"/>
    <rect x="0" y="112" width="3" height="56" fill="#f59e0b"/>
    <text x="16" y="136" fill="#e0e0e0" font-size="12" font-weight="600">451dbd</text>
    <text x="404" y="136" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="154" fill="#606060" font-size="11">Dark since 03:09 UTC</text>
    <text x="404" y="154" fill="#a0a0a0" font-size="12" text-anchor="end">▸</text>
    <text x="16" y="174" fill="#606060" font-size="10" font-style="italic">↑ hover: whole row highlights, cursor: pointer</text>
    <line x1="0" y1="168" x2="420" y2="168" stroke="#1e1e1e"/>
  </g>

  <!-- ===== Column 2: expanded in place ===== -->
  <text x="476" y="28" fill="#a0a0a0" font-size="13" font-weight="700">EXPANDED (click card 2 — grows in place, list reflows)</text>

  <g transform="translate(476,44)">
    <rect width="420" height="620" fill="#111111" stroke="#1e1e1e"/>

    <!-- card 1 : unchanged -->
    <rect x="0" y="0" width="420" height="56" fill="#111111"/>
    <rect x="0" y="0" width="3" height="56" fill="#f59e0b"/>
    <text x="16" y="24" fill="#e0e0e0" font-size="12" font-weight="600">407c0b</text>
    <text x="404" y="24" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="42" fill="#606060" font-size="11">Dark since 03:10 UTC</text>
    <text x="404" y="42" fill="#606060" font-size="12" text-anchor="end">▸</text>
    <line x1="0" y1="56" x2="420" y2="56" stroke="#1e1e1e"/>

    <!-- card 2 : expanded, brighter left border + bg tint to mark "open" -->
    <rect x="0" y="56" width="420" height="264" fill="#151515"/>
    <rect x="0" y="56" width="4" height="264" fill="#f59e0b"/>

    <!-- expanded header row, chevron rotated -->
    <text x="16" y="80" fill="#e0e0e0" font-size="12" font-weight="600">427c0b</text>
    <text x="404" y="80" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="98" fill="#606060" font-size="11">Dark since 03:09 UTC</text>
    <text x="404" y="98" fill="#e0e0e0" font-size="12" text-anchor="end">▾</text>
    <line x1="16" y1="110" x2="404" y2="110" stroke="#2a2a2a"/>

    <!-- detail grid: label / value rows, reuses Row pattern from FlightInfoWidget -->
    <g font-size="11">
      <text x="16" y="130" fill="#606060">ALERT ID</text>
      <text x="404" y="130" fill="#e0e0e0" text-anchor="end">427c0b:SIGNAL_LOSS:1788491...</text>

      <text x="16" y="150" fill="#606060">ENTITY TYPE</text>
      <text x="404" y="150" fill="#e0e0e0" text-anchor="end">aircraft</text>

      <text x="16" y="170" fill="#606060">PRIORITY</text>
      <text x="404" y="170" fill="#f59e0b" text-anchor="end">STANDARD</text>

      <text x="16" y="190" fill="#606060">STATUS</text>
      <text x="404" y="190" fill="#e0e0e0" text-anchor="end">NEW</text>

      <line x1="16" y1="202" x2="404" y2="202" stroke="#1e1e1e"/>

      <text x="16" y="222" fill="#606060">LAST KNOWN LAT</text>
      <text x="404" y="222" fill="#e0e0e0" text-anchor="end">51.6966° N</text>

      <text x="16" y="242" fill="#606060">LAST KNOWN LON</text>
      <text x="404" y="242" fill="#e0e0e0" text-anchor="end">-0.4436° E</text>

      <text x="16" y="262" fill="#606060">ALTITUDE</text>
      <text x="404" y="262" fill="#e0e0e0" text-anchor="end">9,304 m</text>

      <text x="16" y="282" fill="#606060">SPEED</text>
      <text x="404" y="282" fill="#e0e0e0" text-anchor="end">172 m/s</text>

      <text x="16" y="302" fill="#606060">COURSE</text>
      <text x="404" y="302" fill="#e0e0e0" text-anchor="end">312°</text>
    </g>
    <line x1="0" y1="320" x2="420" y2="320" stroke="#1e1e1e"/>

    <!-- card 3 : pushed down, unchanged -->
    <rect x="0" y="320" width="420" height="56" fill="#111111"/>
    <rect x="0" y="320" width="3" height="56" fill="#f59e0b"/>
    <text x="16" y="344" fill="#e0e0e0" font-size="12" font-weight="600">451dbd</text>
    <text x="404" y="344" fill="#f59e0b" font-size="11" text-anchor="end">SIGNAL LOSS</text>
    <text x="16" y="362" fill="#606060" font-size="11">Dark since 03:09 UTC</text>
    <text x="404" y="362" fill="#606060" font-size="12" text-anchor="end">▸</text>
    <text x="16" y="410" fill="#606060" font-size="10" font-style="italic">↑ re-click card 2's header (or the ▾):</text>
    <text x="16" y="426" fill="#606060" font-size="10" font-style="italic">  collapses back to 56px, in the same slot</text>
  </g>

  <text x="24" y="600" fill="#606060" font-size="10">Only one card open at a time. Rows above/below reflow — no overlay, no modal. Data shown is already in the Alert domain model (payload.*) — no new API call on expand.</text>
</svg>
