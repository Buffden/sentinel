<svg width="1536" height="1024" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI',system-ui,sans-serif">

  <!-- ── Background ── -->
  <rect width="1536" height="1024" fill="#0b1421"/>

  <!-- Subtle dot grid -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#1a2d45" opacity="0.6"/>
    </pattern>
    <!-- Card shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1536" height="1024" fill="url(#grid)"/>

  <!-- Atmospheric map-like glow bottom-center (teal, matching reference) -->
  <ellipse cx="768" cy="1100" rx="700" ry="340" fill="#002020" opacity="0.35"/>
  <!-- Secondary glow top-right -->
  <ellipse cx="1350" cy="-80" rx="500" ry="260" fill="#00152a" opacity="0.4"/>

  <!-- ── Simulated dim map coastlines / grid lines ── -->
  <!-- Horizontal graticules -->
  <line x1="0"    y1="220"  x2="1536" y2="220"  stroke="#0f2030" stroke-width="0.8"/>
  <line x1="0"    y1="400"  x2="1536" y2="400"  stroke="#0f2030" stroke-width="0.8"/>
  <line x1="0"    y1="590"  x2="1536" y2="590"  stroke="#0f2030" stroke-width="0.8"/>
  <line x1="0"    y1="780"  x2="1536" y2="780"  stroke="#0f2030" stroke-width="0.8"/>
  <!-- Vertical graticules -->
  <line x1="256"  y1="0"    x2="256"  y2="1024" stroke="#0f2030" stroke-width="0.8"/>
  <line x1="512"  y1="0"    x2="512"  y2="1024" stroke="#0f2030" stroke-width="0.8"/>
  <line x1="768"  y1="0"    x2="768"  y2="1024" stroke="#0f2030" stroke-width="0.8"/>
  <line x1="1024" y1="0"    x2="1024" y2="1024" stroke="#0f2030" stroke-width="0.8"/>
  <line x1="1280" y1="0"    x2="1280" y2="1024" stroke="#0f2030" stroke-width="0.8"/>

  <!-- Background entity dots (live flights, dim) -->
  <g opacity="0.18">
    <circle cx="210"  cy="310"  r="2.5" fill="#3b82f6"/>
    <circle cx="430"  cy="260"  r="2"   fill="#3b82f6"/>
    <circle cx="580"  cy="370"  r="2.5" fill="#3b82f6"/>
    <circle cx="660"  cy="195"  r="2"   fill="#3b82f6"/>
    <circle cx="820"  cy="290"  r="2"   fill="#3b82f6"/>
    <circle cx="950"  cy="340"  r="2.5" fill="#3b82f6"/>
    <circle cx="1080" cy="260"  r="2"   fill="#3b82f6"/>
    <circle cx="1200" cy="390"  r="2.5" fill="#3b82f6"/>
    <circle cx="1350" cy="310"  r="2"   fill="#3b82f6"/>
    <circle cx="320"  cy="680"  r="2"   fill="#3b82f6"/>
    <circle cx="490"  cy="720"  r="2.5" fill="#3b82f6"/>
    <circle cx="700"  cy="650"  r="2"   fill="#3b82f6"/>
    <circle cx="880"  cy="710"  r="2.5" fill="#3b82f6"/>
    <circle cx="1100" cy="660"  r="2"   fill="#3b82f6"/>
    <circle cx="1300" cy="730"  r="2.5" fill="#3b82f6"/>
    <!-- One amber alert dot -->
    <circle cx="530"  cy="490"  r="3"   fill="#f59e0b"/>
    <!-- One red alert dot -->
    <circle cx="1020" cy="540"  r="3"   fill="#ef4444"/>
  </g>

  <!-- ── Top bar ── -->
  <rect x="0" y="0" width="1536" height="48" fill="#0d1825" opacity="0.95"/>
  <rect x="0" y="47" width="1536" height="1" fill="#1a2d45"/>

  <!-- Sentinel wordmark in top bar -->
  <text x="24" y="30" font-size="13" font-weight="600" letter-spacing="3" fill="#80a0c0" text-anchor="start">SENTINEL</text>
  <text x="103" y="30" font-size="11" font-weight="400" fill="#2d4a62" text-anchor="start">/ REAL-TIME TRACKING</text>

  <!-- Status pill top-right -->
  <rect x="1420" y="14" width="92" height="20" rx="3" fill="#0d1f17" stroke="#1a4030" stroke-width="1"/>
  <circle cx="1432" cy="24" r="3.5" fill="#22c55e"/>
  <text x="1441" y="28.5" font-size="10" fill="#22c55e" font-weight="500" letter-spacing="0.5">SYSTEM LIVE</text>

  <!-- ── Auth card ── -->
  <rect x="583" y="280" width="370" height="420" rx="4" fill="#0d1b2a" stroke="#1a2d45" stroke-width="1" filter="url(#shadow)"/>
  <!-- Card top accent line -->
  <rect x="583" y="280" width="370" height="3" rx="4" fill="#2563eb"/>

  <!-- Logo area -->
  <!-- Hexagon icon mark -->
  <g transform="translate(750,345)">
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <polygon points="0,-13 11,-6.5 11,6.5 0,13 -11,6.5 -11,-6.5" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="4" fill="#3b82f6"/>
    <!-- Crosshair lines -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#1a3a5c" stroke-width="0.8"/>
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#1a3a5c" stroke-width="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="768" y="400" font-size="22" font-weight="700" letter-spacing="6" fill="#c8d8e8" text-anchor="middle">SENTINEL</text>
  <text x="768" y="420" font-size="10" font-weight="400" letter-spacing="2.5" fill="#3b6080" text-anchor="middle">GEOSPATIAL OPERATIONS</text>

  <!-- Divider -->
  <line x1="610" y1="438" x2="926" y2="438" stroke="#1a2d45" stroke-width="1"/>

  <!-- Sign-in label -->
  <text x="768" y="468" font-size="12" font-weight="400" fill="#607080" text-anchor="middle" letter-spacing="0.5">Sign in to your workspace</text>

  <!-- Google OAuth button -->
  <rect x="638" y="484" width="260" height="44" rx="3" fill="#101e30" stroke="#243350" stroke-width="1"/>
  <!-- Google G icon placeholder -->
  <circle cx="668" cy="506" r="10" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="668" y="511" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle">G</text>
  <text x="780" y="511" font-size="12" font-weight="500" fill="#a0b8cc" text-anchor="middle" letter-spacing="0.3">Continue with Google</text>

  <!-- Button hover-state outline hint -->
  <rect x="638" y="484" width="260" height="44" rx="3" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.4"/>

  <!-- Workspace note -->
  <text x="768" y="552" font-size="10" fill="#2d4a62" text-anchor="middle">Authentication via Google OAuth 2.0</text>
  <text x="768" y="566" font-size="10" fill="#2d4a62" text-anchor="middle">Access is restricted to authorised workspaces</text>

  <!-- Divider -->
  <line x1="610" y1="590" x2="926" y2="590" stroke="#1a2d45" stroke-width="1"/>

  <!-- System stats row -->
  <g font-size="10" fill="#2d4a62" letter-spacing="0.3">
    <text x="680" y="614" text-anchor="middle">ENTITIES</text>
    <text x="768" y="614" text-anchor="middle">ALERTS</text>
    <text x="856" y="614" text-anchor="middle">UPTIME</text>
    <text x="680" y="630" font-size="13" font-weight="600" fill="#80a0c0" text-anchor="middle">12,048</text>
    <text x="768" y="630" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">3</text>
    <text x="856" y="630" font-size="13" font-weight="600" fill="#22c55e" text-anchor="middle">99.98%</text>
  </g>

  <!-- ── Bottom status bar ── -->
  <rect x="0" y="992" width="1536" height="32" fill="#080f1a" opacity="0.95"/>
  <rect x="0" y="992" width="1536" height="1" fill="#1a2d45"/>

  <text x="16"   y="1012" font-size="10" fill="#2d4a62" letter-spacing="0.5">SENTINEL v0.1.0-dev</text>
  <text x="200"  y="1012" font-size="10" fill="#1a3050" letter-spacing="0.3">|</text>
  <text x="210"  y="1012" font-size="10" fill="#2d4a62" letter-spacing="0.3">Kafka: Redpanda</text>
  <text x="330"  y="1012" font-size="10" fill="#1a3050" letter-spacing="0.3">|</text>
  <text x="340"  y="1012" font-size="10" fill="#2d4a62" letter-spacing="0.3">Store: TimescaleDB · Neo4j · Redis</text>
  <circle cx="1460" cy="1008" r="3" fill="#22c55e"/>
  <text x="1470" y="1012" font-size="10" fill="#22c55e" letter-spacing="0.5">ALL SYSTEMS NOMINAL</text>

</svg>
