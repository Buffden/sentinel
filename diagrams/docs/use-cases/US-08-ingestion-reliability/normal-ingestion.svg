19 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="180" x="685" y="501.7388">Each consumer group reads</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="216" x="685" y="516.8716">independently from its own offset.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="218" x="685" y="532.0044">A slow correlation worker does not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="184" x="685" y="547.1372">block the position consumer.</text><!--MD5=[b67fa127a4670fbe1c75d3dd886e7cf4]
@startuml normal-ingestion
title US-08: Normal Ingestion - Poller Publishes Without Blocking

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

collections "OpenSky / AIS\nFeed" as Feed
participant "Ingestion\nPoller" as Poller
queue "Kafka\nadsb.raw / ais.raw" as Kafka
participant "Position\nConsumer" as PosConsumer
participant "Correlation\nWorker" as Correlation

Feed -> Poller : position pings (burst)

loop for each ping
  Poller -> Kafka : publish event\n{ entity_id, lat, lon, timestamp_ms }
  Kafka - -> Poller : ack

  note over Poller
    Poller does not wait for consumers.
    Publishes and moves on immediately.
    No retry or buffer logic needed
    in the poller itself.
  end note
end

note over Kafka
  Events retained for configured
  retention window regardless of
  consumer processing speed.
end note

Kafka -> PosConsumer : consume at own pace\n(consumer group: position-consumer)
Kafka -> Correlation : consume at own pace\n(consumer group: correlation-worker)

note over PosConsumer, Correlation
  Each consumer group reads
  independently from its own offset.
  A slow correlation worker does not
  block the position consumer.
end note

@enduml

