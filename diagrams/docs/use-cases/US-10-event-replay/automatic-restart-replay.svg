><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="163" x="231" y="653.5669">from position.normalized.</text><polygon fill="#A80036" points="629,687.7656,639,691.7656,629,695.7656,633,691.7656" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="367" x2="635" y1="691.7656" y2="691.7656"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="250" x="374" y="686.6997">commit offset as events are processed</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="367" x2="409" y1="720.8984" y2="720.8984"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="409" x2="409" y1="720.8984" y2="733.8984"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="368" x2="409" y1="733.8984" y2="733.8984"/><polygon fill="#A80036" points="378,729.8984,368,733.8984,378,737.8984,374,733.8984" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="218" x="374" y="715.8325">caught up - processing live events</text><!--MD5=[bd875438ab2a385f80f5f891434f9720]
@startuml automatic-restart-replay
title US-10: Automatic Restart Replay - Consumer Resumes from Last Committed Offset

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

queue "Kafka\nadsb.raw / ais.raw" as Kafka
participant "Position\nConsumer" as Consumer
database "Kafka\noffset store\n(__consumer_offsets)" as Offsets

Consumer -> Kafka : consuming events
Consumer -> Offsets : commit offset after each\nsuccessful batch

note over Consumer
  Consumer crashes mid-batch.
  Last committed offset is preserved.
end note

Consumer ->x Consumer : crash

note over Kafka
  Events continue to accumulate.
  Retention window keeps all events
  regardless of consumer state.
end note

Consumer -> Consumer : restart
Consumer -> Offsets : fetch last committed offset
Offsets - -> Consumer : resume from offset N

Consumer -> Kafka : consume from offset N\n(replay missed events)
Kafka - -> Consumer : all events since last commit

note over Consumer
  Idempotent writes ensure replayed
  events produce no duplicates
  in TimescaleDB or Redis. (US-11)
  The Correlation Worker applies the same
  guarantee for Neo4j when replaying
  from position.normalized.
end note

Consumer -> Offsets : commit offset as events are processed
Consumer -> Consumer : caught up - processing live events

@enduml

