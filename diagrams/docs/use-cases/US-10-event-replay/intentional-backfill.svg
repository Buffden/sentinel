<text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="243" x="98" y="570.1685">Same mechanism works for corrected</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="253" x="98" y="585.3013">anomaly rules - rewind and re-evaluate.</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="231.5" x2="273.5" y1="638.6328" y2="638.6328"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="273.5" x2="273.5" y1="638.6328" y2="651.6328"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="232.5" x2="273.5" y1="651.6328" y2="651.6328"/><polygon fill="#A80036" points="242.5,647.6328,232.5,651.6328,242.5,655.6328,238.5,651.6328" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="104" x="238.5" y="618.4341">offset caught up</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="141" x="238.5" y="633.5669">processing live events</text><!--MD5=[f05fc3bb9e2cbe70c27fd0987f7ad485]
@startuml intentional-backfill
title US-10: Intentional Backfill - Consumer Rewound to Rebuild State

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

actor Developer
participant "Correlation\nWorker" as Worker
queue "Kafka\nposition.normalized" as Kafka
database "Neo4j\nentity graph" as Neo4j
database "Kafka\noffset store\n(__consumer_offsets)" as Offsets

note over Neo4j
  Neo4j restarted.
  Entity relationship graph lost.
  Must be rebuilt from event history.
end note

Developer -> Worker : stop correlation worker
Developer -> Offsets : reset consumer group offset\nto timestamp T (start of retention window)

note over Offsets
  Offset reset is explicit and intentional.
  Kafka retains all events within
  the configured retention window.
end note

Developer -> Worker : restart correlation worker

Worker -> Kafka : consume from reset offset T
Kafka - -> Worker : all position events from T onwards

loop for each replayed event
  Worker -> Neo4j : MERGE proximity edges\n(idempotent - no duplicates created)
end

note over Worker
  Graph rebuilt from event history
  without re-querying OpenSky or AIS.
  Same mechanism works for corrected
  anomaly rules - rewind and re-evaluate.
end note

Worker -> Worker : offset caught up\nprocessing live events

@enduml

