ause position_history</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="326" x="630" y="548.7075">is derived directly from the retained source records</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="252" x="630" y="563.8403">and has a deterministic unique identity.</text><path d="M8,585.9063 L8,655.9063 L846,655.9063 L846,595.9063 L836,585.9063 L8,585.9063 " fill="#FFFDE7" filter="url(#fufazjaxj74bq)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M836,585.9063 L836,595.9063 L846,595.9063 L836,585.9063 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="322" x="254" y="602.9731">A total Neo4j data-loss rebuild is a separate offline</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="333" x="254" y="618.106">recomputation problem because historical proximity</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="331" x="254" y="633.2388">detection requires pair/spatial state that the normal</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="322" x="254" y="648.3716">Correlation Worker reads from the live Redis index.</text><!--MD5=[8c3ac8711d0e5b28ce2509336a09b5a5]
@startuml intentional-backfill
title US-10: Intentional Backfill - Isolated Position-History Rebuild

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

actor Developer
queue "Kafka\nadsb.raw / ais.raw" as Kafka
participant "Position Consumer\n(backfill mode / separate group)" as Backfill
database "TimescaleDB\nposition_history" as TSDB

Developer -> Backfill : start with target=position_history\nand explicit historical offset/time range
Backfill -> Kafka : consume retained raw records\nusing separate backfill consumer group
Kafka - -> Backfill : historical records

loop each retained record
  Backfill -> Backfill : parse + normalize\ncompute observed_at + history_geo_cell
  Backfill -> TSDB : INSERT position_history\nON CONFLICT (entity_id, observed_at) DO NOTHING
end

note over Backfill
  Backfill mode suppresses live side effects:
  - no entity:live writes
  - no geo-cell live membership
  - no position-updates pub/sub
  - no position.normalized into live downstream path
  - no deviation/proximity candidates
  - no alerts
end note

note over TSDB
  Historical rebuild is safe because position_history
  is derived directly from the retained source records
  and has a deterministic unique identity.
end note

note over Developer, TSDB
  A total Neo4j data-loss rebuild is a separate offline
  recomputation problem because historical proximity
  detection requires pair/spatial state that the normal
  Correlation Worker reads from the live Redis index.
end note

@enduml

