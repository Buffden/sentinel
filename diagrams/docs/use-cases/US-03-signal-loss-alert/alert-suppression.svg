1="387.5" x2="532.5" y1="546.8047" y2="546.8047"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="127" x="399.5" y="541.7388">DEL alert-state:ABC</text><path d="M284,559.8047 L284,629.8047 L628,629.8047 L628,569.8047 L618,559.8047 L284,559.8047 " fill="#FFFDE7" filter="url(#f40s383eu6v4y)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M618,559.8047 L618,569.8047 L628,569.8047 L618,559.8047 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="323" x="290" y="576.8716">The position consumer clears the suppression key,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="293" x="290" y="592.0044">not the evaluator. This ensures the key is only</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="299" x="290" y="607.1372">removed when a real ping is received — not on</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="146" x="290" y="622.27">a timer or assumption.</text><path d="M13,646.3359 L90,646.3359 L90,653.3359 L80,663.3359 L13,663.3359 L13,646.3359 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="144.7969" style="stroke: #000000; stroke-width: 2.0;" width="435" x="13" y="646.3359"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="32" x="28" y="659.4028">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="265" x="105" y="658.5464">[next evaluation cycle (entity live again)]</text><polygon fill="#A80036" points="370.5,680.6016,380.5,684.6016,370.5,688.6016,374.5,684.6016" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="142.5" x2="376.5" y1="684.6016" y2="684.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="127" x="149.5" y="679.5356">GET alert-state:ABC</text><polygon fill="#A80036" points="153.5,709.7344,143.5,713.7344,153.5,717.7344,149.5,713.7344" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="147.5" x2="381.5" y1="713.7344" y2="713.7344"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="119" x="159.5" y="708.6685">nil (no active alert)</text><path d="M23,726.7344 L23,781.7344 L258,781.7344 L258,736.7344 L248,726.7344 L23,726.7344 " fill="#FFFDE7" filter="url(#f40s383eu6v4y)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M248,726.7344 L248,736.7344 L258,736.7344 L248,726.7344 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="29" y="743.8013">Entity is back. Alert state cleared.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="29" y="758.9341">If entity goes dark again in future,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="170" x="29" y="774.0669">a new alert will be emitted.</text><!--MD5=[36e61879ea3466e10a65d68f996c34c4]
@startuml alert-suppression
title US-03: Alert Suppression - No Re-Emit While Entity Stays Dark

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Alert\nEvaluator\n(leader)" as Evaluator
database "Redis\nalert-state:{id}" as AlertState
participant "Position\nConsumer" as Consumer
database "Redis\nentity:live:{id}" as LiveState
queue "Kafka\nalerts" as Kafka

note over Evaluator
  Entity ABC is dark.
  Alert has already been emitted
  on a previous evaluation cycle.
end note

loop evaluation cycle N (entity still dark)
  Evaluator -> AlertState : GET alert-state:ABC
  AlertState - -> Evaluator : SIGNAL_LOSS alert already active

  Evaluator -> Evaluator : skip - alert already raised\ndo not re-emit

  note over Evaluator
    Operator does not receive
    a duplicate alert on every cycle.
    One alert per loss event.
  end note
end

note over Consumer, LiveState
  Entity ABC starts broadcasting again.
  Position consumer receives a new ping
  and writes it to Redis.
end note

Consumer -> LiveState : HSET entity:live:ABC\n{ lat, lon, last_seen_ms }
Consumer -> AlertState : DEL alert-state:ABC
note over Consumer, AlertState
  The position consumer clears the suppression key,
  not the evaluator. This ensures the key is only
  removed when a real ping is received — not on
  a timer or assumption.
end note

loop next evaluation cycle (entity live again)
  Evaluator -> AlertState : GET alert-state:ABC
  AlertState - -> Evaluator : nil (no active alert)

  note over Evaluator
    Entity is back. Alert state cleared.
    If entity goes dark again in future,
    a new alert will be emitted.
  end note
end

@enduml

