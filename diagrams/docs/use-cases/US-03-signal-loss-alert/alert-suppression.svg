E" filter="url(#f40s383eu6v4y)" style="stroke: #000000; stroke-width: 1.5;"/><path d="M702.5,47.9531 C702.5,57.9531 720.5,57.9531 720.5,57.9531 C720.5,57.9531 738.5,57.9531 738.5,47.9531 " fill="none" style="stroke: #000000; stroke-width: 1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="39" x="698" y="820.1279">Redis</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="100" x="667.5" y="836.4248">entity:live:{id}</text><path d="M702.5,849.7266 C702.5,839.7266 720.5,839.7266 720.5,839.7266 C720.5,839.7266 738.5,839.7266 738.5,849.7266 L738.5,875.7266 C738.5,885.7266 720.5,885.7266 720.5,885.7266 C720.5,885.7266 702.5,885.7266 702.5,875.7266 L702.5,849.7266 " fill="#FEFECE" filter="url(#f40s383eu6v4y)" style="stroke: #000000; stroke-width: 1.5;"/><path d="M702.5,849.7266 C702.5,859.7266 720.5,859.7266 720.5,859.7266 C720.5,859.7266 738.5,859.7266 738.5,849.7266 " fill="none" style="stroke: #000000; stroke-width: 1.5;"/><path d="M788.5,73.9531 L836.5,73.9531 C841.5,73.9531 841.5,95.25 841.5,95.25 C841.5,95.25 841.5,116.5469 836.5,116.5469 L788.5,116.5469 C783.5,116.5469 783.5,95.25 783.5,95.25 C783.5,95.25 783.5,73.9531 788.5,73.9531 " fill="#FEFECE" filter="url(#f40s383eu6v4y)" style="stroke: #A80036; stroke-width: 2.0;"/><path d="M836.5,73.9531 C831.5,73.9531 831.5,95.25 831.5,95.25 C831.5,116.5469 836.5,116.5469 836.5,116.5469 " fill="none" style="stroke: #A80036; stroke-width: 2.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="37" x="789" y="91.9482">Kafka</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="38" x="788.5" y="108.2451">alerts</text><path d="M788.5,807.1328 L836.5,807.1328 C841.5,807.1328 841.5,828.4297 841.5,828.4297 C841.5,828.4297 841.5,849.7266 836.5,849.7266 L788.5,849.7266 C783.5,849.7266 783.5,828.4297 783.5