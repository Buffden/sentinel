n before alert-state deletion.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="403" x="817.5" y="634.0044">This preserves a bounded post-resume correlation opportunity.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="341" x="817.5" y="649.1372">The Alert Evaluator consumes/deletes it if a qualifying</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="284" x="817.5" y="664.27">proximity candidate produces a COMPOSITE.</text><path d="M259,686.3359 L259,726.3359 L658,726.3359 L658,696.3359 L648,686.3359 L259,686.3359 " fill="#FFFDE7" filter="url(#ficmdaugmr1kp)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M648,686.3359 L648,696.3359 L658,696.3359 L648,686.3359 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="319" x="265" y="703.4028">alert-state is detection-loop/composite state only.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="378" x="265" y="718.5356">Durable operator lifecycle state lives in TimescaleDB alerts.</text><!--MD5=[1d4ab0618f6846abe28f8db5237ea422]
@startuml alert-suppression
title US-03: Alert Suppression and Resume Handoff

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Alert\nEvaluator\n(leader)" as Evaluator
database "Redis\nalert-state:{id}" as AlertState
participant "Position\nConsumer" as Consumer
database "Redis\nentity:live:{id}" as LiveState
database "Redis\nrecent-loss:{id}" as RecentLoss

== Entity remains dark ==
loop scheduled scan
  Evaluator -> AlertState : HGETALL alert-state:ABC
  AlertState - -> Evaluator : { dark_since_ms, signal_loss_alert_id, composite_issued }
  Evaluator -> Evaluator : active episode exists\ndo not create another SIGNAL_LOSS logical alert
end

== Entity resumes ==
Consumer -> LiveState : accept newer position for ABC
Consumer -> AlertState : HGETALL alert-state:ABC
AlertState - -> Consumer : { dark_since_ms, signal_loss_alert_id, composite_issued }

alt prior signal-loss state exists
  Consumer -> RecentLoss : HSET recent-loss:ABC\ndark_since_ms\nresumed_at_ms = incoming.timestamp_ms\nsignal_loss_alert_id\nEXPIRE COMPOSITE_CORRELATION_WINDOW_MS
  Consumer -> AlertState : DEL alert-state:ABC
end

note over Consumer, RecentLoss
  recent-loss is written before alert-state deletion.
  This preserves a bounded post-resume correlation opportunity.
  The Alert Evaluator consumes/deletes it if a qualifying
  proximity candidate produces a COMPOSITE.
end note

note over AlertState
  alert-state is detection-loop/composite state only.
  Durable operator lifecycle state lives in TimescaleDB alerts.
end note

@enduml

