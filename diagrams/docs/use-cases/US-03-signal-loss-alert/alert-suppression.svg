-state:ABC</text><polygon fill="#A80036" points="187.5,596.0703,177.5,600.0703,187.5,604.0703,183.5,600.0703" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="181.5" x2="415.5" y1="600.0703" y2="600.0703"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="119" x="193.5" y="595.0044">nil (no active alert)</text><path d="M57,613.0703 L57,668.0703 L292,668.0703 L292,623.0703 L282,613.0703 L57,613.0703 " fill="#FFFDE7" filter="url(#fph2nsi7eibrt)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M282,613.0703 L282,623.0703 L292,623.0703 L282,613.0703 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="63" y="630.1372">Entity is back. Alert state cleared.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="214" x="63" y="645.27">If entity goes dark again in future,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="170" x="63" y="660.4028">a new alert will be emitted.</text><!--MD5=[6a4ca2c669b21f0346d300cdedbe4e14]
@startuml alert-suppression
title US-03: Alert Suppression - No Re-Emit While Entity Stays Dark

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Alert\nEvaluator\n(leader)" as Evaluator
database "Redis\nalert-state:{id}" as AlertState
queue "Kafka\nalerts" as Kafka

note over Evaluator
  Entity ABC is dark.
  Alert has already been emitted
  on a previous evaluation cycle.
end note

loop evaluation cycle N (entity still dark)
  Evaluator -> AlertState : GET alert-state:ABC
  AlertState - -> Evaluator : SIGNAL_LOSS alert already active

  Evaluator -> Evaluator : skip - alert already raised\ndo not re-emit

  note over Evaluator
    Operator does not receive
    a duplicate alert on every cycle.
    One alert per loss event.
  end note
end

note over Evaluator
  Entity ABC starts broadcasting again.
  Redis key entity:live:ABC is restored
  by the position consumer.
end note

Evaluator -> AlertState : DEL alert-state:ABC\n(clear active alert record)

loop next evaluation cycle (entity live again)
  Evaluator -> AlertState : GET alert-state:ABC
  AlertState - -> Evaluator : nil (no active alert)

  note over Evaluator
    Entity is back. Alert state cleared.
    If entity goes dark again in future,
    a new alert will be emitted.
  end note
end

@enduml

