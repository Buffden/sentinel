if" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="220" x="797" y="703.9028">Alert is raised once per loss event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="224" x="797" y="719.0356">Not re-emitted on every evaluation</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="224" x="797" y="734.1685">cycle while the entity remains dark.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="237" x="797" y="749.3013">Operator can acknowledge or resolve</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="216" x="797" y="764.4341">via the alert lifecycle flow (US-13).</text><!--MD5=[ef07a250274173d5faf63f7bda69ca71]
@startuml alert-delivery
title US-03: Alert Delivery - Signal Loss Persisted and Pushed to Scoped Operators

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

queue "Kafka\nalerts" as Kafka
participant "Express API" as API
database "TimescaleDB\nalerts table" as TSDB
participant "Angular\nDashboard" as Dashboard
actor Operator

Kafka -> API : consume SIGNAL_LOSS alert\n{ alert_id, entity_id, alert_type,\n  window_start_ms, last_known_position,\n  duration_ms }

API -> TSDB : INSERT INTO alerts\n( alert_id, entity_id, alert_type,\n  status, created_at, payload )\nON CONFLICT (alert_id) DO NOTHING

note over TSDB
  alert_id = {entity_id}:SIGNAL_LOSS:{window_start_ms}
  Idempotent - safe under Kafka replay.
  Initial status = NEW.
  This is the durable record of the alert
  that the operator can acknowledge and resolve.
end note

TSDB - -> API : inserted (or conflict - no-op)

note over API
  Fan-out: check each active WebSocket connection's
  saved scope before pushing.
  geo_region bounds + entity_type + alert_type
  must all match.
end note

API - -> Dashboard : push alert over WebSocket\n(only to connections whose scope matches\nentity position, type, and alert type)

note over Dashboard
  Alert panel updated in real time.
  Entity marker on map flagged.
  No page refresh required.
end note

Dashboard - -> Operator : signal loss alert displayed\n(entity ID, last position, time dark)\nstatus: NEW

note over Operator
  Alert is raised once per loss event.
  Not re-emitted on every evaluation
  cycle while the entity remains dark.
  Operator can acknowledge or resolve
  via the alert lifecycle flow (US-13).
end note

@enduml

