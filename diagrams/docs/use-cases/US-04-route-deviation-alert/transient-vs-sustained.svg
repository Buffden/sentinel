 y1="463.1406" y2="463.1406"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="274" x="125.5" y="458.0747">{ entity_id: DEF, status: BACK_IN_RANGE }</text><polygon fill="#A80036" points="705.5,488.2734,715.5,492.2734,705.5,496.2734,709.5,492.2734" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="416.5" x2="711.5" y1="492.2734" y2="492.2734"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="170" x="423.5" y="487.2075">DEL deviation-counter:DEF</text><path d="M270.5,505.2734 L270.5,560.2734 L557.5,560.2734 L557.5,515.2734 L547.5,505.2734 L270.5,505.2734 " fill="#FFFDE7" filter="url(#f1v41spul8fg1v)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M547.5,505.2734 L547.5,515.2734 L557.5,515.2734 L547.5,505.2734 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="264" x="276.5" y="522.3403">Counter reset. Transient - no alert raised.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="266" x="276.5" y="537.4731">Deviation Detector observed entity return</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="178" x="276.5" y="552.606">to within baseline threshold.</text><rect fill="#EEEEEE" filter="url(#f1v41spul8fg1v)" height="3" style="stroke: #EEEEEE; stroke-width: 1.0;" width="854" x="17.5" y="590.2383"/><line style="stroke: #000000; stroke-width: 1.0;" x1="17.5" x2="871.5" y1="590.2383" y2="590.2383"/><line style="stroke: #000000; stroke-width: 1.0;" x1="17.5" x2="871.5" y1="593.2383" y2="593.2383"/><rect fill="#EEEEEE" filter="url(#f1v41spul8fg1v)" height="23.1328" style="stroke: #000000; stroke-width: 2.0;" width="458" x="215.5" y="579.6719"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="439" x="221.5" y="595.7388">Sustained deviation (N consecutive OUT_OF_RANGE events)</text><path d="M27.5,619.8047 L104.5,619.8047 L104.5,626.8047 L94.5,636.8047 L27.5,636.8047 L27.5,619.8047 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="90.5313" style="stroke: #000000; stroke-width: 2.0;" width="781" x="27.5" y="619.8047"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="32" x="42.5" y="632.8716">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="272" x="119.5" y="632.0151">[for N consecutive OUT_OF_RANGE events]</text><polygon fill="#A80036" points="404.5,669.2031,414.5,673.2031,404.5,677.2031,408.5,673.2031" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="118.5" x2="410.5" y1="673.2031" y2="673.2031"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="262" x="125.5" y="653.0044">{ entity_id: DEF, status: OUT_OF_RANGE,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="171" x="133.5" y="668.1372">deviation_metres: 45000 }</text><polygon fill="#A80036" points="705.5,698.3359,715.5,702.3359,705.5,706.3359,709.5,702.3359" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="416.5" x2="711.5" y1="702.3359" y2="702.3359"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="175" x="423.5" y="697.27">INCR deviation-counter:DEF</text><polygon fill="#A80036" points="427.5,734.4688,417.5,738.4688,427.5,742.4688,423.5,738.4688" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="421.5" x2="716.5" y1="738.4688" y2="738.4688"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="277" x="433.5" y="733.4028">counter &gt;= DEVIATION_SUSTAINED_PINGS</text><polygon fill="#A80036" points="825.5,809,835.5,813,825.5,817,829.5,813" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="416.5" x2="831.5" y1="813" y2="813"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="201" x="423.5" y="762.5356">publish ROUTE_DEVIATION alert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="181" x="423.5" y="777.6685">{ entity_id, current_position,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="233" x="431.5" y="792.8013">baseline_position, deviation_metres,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="120" x="431.5" y="807.9341">sustained_cycles }</text><!--MD5=[e61235e5e5b13680eb80e76e37ce1feb]
@startuml transient-vs-sustained
title US-04: Transient vs Sustained - Single OUT_OF_RANGE Does Not Alert, Sustained Deviation Does

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

queue "Kafka\ndeviation.candidates" as DevCandKafka
participant "Alert\nEvaluator\n(leader)" as Evaluator
database "Redis\ndeviation-counter:{id}" as DevState
queue "Kafka\nalerts" as Kafka

== Transient OUT_OF_RANGE event (no alert) ==

DevCandKafka -> Evaluator : { entity_id: DEF, status: OUT_OF_RANGE,\n  deviation_metres: 45000 }

Evaluator -> DevState : INCR deviation-counter:DEF
DevState - -> Evaluator : counter = 1

Evaluator -> Evaluator : counter < DEVIATION_SUSTAINED_PINGS\nno alert emitted

note over Evaluator
  A single OUT_OF_RANGE event could be
  a GPS glitch or brief correction.
  Not actionable on its own.
end note

== BACK_IN_RANGE event - counter reset ==

DevCandKafka -> Evaluator : { entity_id: DEF, status: BACK_IN_RANGE }

Evaluator -> DevState : DEL deviation-counter:DEF
note over Evaluator
  Counter reset. Transient - no alert raised.
  Deviation Detector observed entity return
  to within baseline threshold.
end note

== Sustained deviation (N consecutive OUT_OF_RANGE events) ==

loop for N consecutive OUT_OF_RANGE events
  DevCandKafka -> Evaluator : { entity_id: DEF, status: OUT_OF_RANGE,\n  deviation_metres: 45000 }
  Evaluator -> DevState : INCR deviation-counter:DEF
end

DevState - -> Evaluator : counter >= DEVIATION_SUSTAINED_PINGS

Evaluator -> Kafka : publish ROUTE_DEVIATION alert\n{ entity_id, current_position,\n  baseline_position, deviation_metres,\n  sustained_cycles }

@enduml

