st="spacingAndGlyphs" textLength="213" x="788" y="507.981">Durable DB state is authoritative.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="321" x="788" y="523.1138">ACKNOWLEDGED remains active and may later be</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="304" x="788" y="538.2466">superseded by a COMPOSITE system transition.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="275" x="788" y="553.3794">RESOLVED and SUPERSEDED are terminal.</text><path d="M136,575.4453 L136,615.4453 L1100,615.4453 L1100,585.4453 L1090,575.4453 L136,575.4453 " fill="#FFFDE7" filter="url(#fn0cetyh0wn08)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1090,575.4453 L1090,585.4453 L1100,585.4453 L1090,575.4453 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="285" x="442.75" y="592.5122">WebSocket lifecycle delivery is at-least-once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="338" x="442.75" y="607.645">Clients converge by alert_id + durable lifecycle state.</text><!--MD5=[5e0bdb5d8060b033de9d33481181c8ee]
@startuml acknowledge-flow
title US-13: Acknowledge Flow - Durable Transition + Distributed Lifecycle Fan-Out

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

actor Operator
participant "Angular\nDashboard" as Dashboard
participant "Express API" as API
database "TimescaleDB\nalerts" as TSDB
database "Redis\nalert-events" as AlertEvents
participant "API\n(all instances)" as APIAll

Operator -> Dashboard : click Acknowledge
Dashboard -> API : PATCH /alerts/{alert_id}\n{ status: ACKNOWLEDGED }

API -> TSDB : UPDATE alerts\nSET status='ACKNOWLEDGED', acknowledged_at=..., acknowledged_by=...\nWHERE alert_id=$id AND status='NEW'
TSDB - -> API : transitioned row or no-op

alt row transitioned NEW -> ACKNOWLEDGED
  API -> AlertEvents : PUBLISH ALERT_STATUS_CHANGED\n{ alert_id, status: ACKNOWLEDGED, ... }
  AlertEvents - -> APIAll : lifecycle event
  APIAll - -> Dashboard : WebSocket lifecycle update
else already ACKNOWLEDGED / terminal / invalid transition
  API - -> Dashboard : return current durable state\n(no duplicate transition event required)
end

note over TSDB
  Durable DB state is authoritative.
  ACKNOWLEDGED remains active and may later be
  superseded by a COMPOSITE system transition.
  RESOLVED and SUPERSEDED are terminal.
end note

note over AlertEvents, Dashboard
  WebSocket lifecycle delivery is at-least-once.
  Clients converge by alert_id + durable lifecycle state.
end note

@enduml

