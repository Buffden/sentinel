71,663.3359 L1271,673.3359 L1281,673.3359 L1271,663.3359 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="200" x="821" y="680.4028">Both stores in consistent state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="445" x="821" y="695.5356">TimescaleDB: ON CONFLICT DO NOTHING silently drops duplicate row.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="403" x="821" y="710.6685">Redis: timestamp guard skips the HSET when event timestamp</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="437" x="821" y="725.8013">is not newer than stored last_seen_ms — prevents value regression.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="285" x="821" y="740.9341">No coordination between instances required.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="329" x="821" y="756.0669">The Correlation Worker applies the same guarantee</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="297" x="821" y="771.1997">when writing PROXIMITY_EVENT edges to Neo4j</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="163" x="821" y="786.3325">from position.normalized.</text><!--MD5=[42e5820d3c1ec64a61d0c6a190597602]
@startuml duplicate-delivery
title US-11: Duplicate Delivery - Same Kafka Event Processed Twice, No Duplicates Created

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

queue "Kafka\nadsb.raw / ais.raw" as Kafka
participant "Position\nConsumer" as Consumer
database "TimescaleDB\nposition_history" as TSDB
database "Redis\nentity:live:{id}" as Redis

note over Kafka
  At-least-once delivery.
  Same event can be delivered
  more than once after a
  consumer restart or rebalance.
end note

Kafka -> Consumer : deliver event\n{ entity_id: "ABC123", timestamp_ms: 1700000000000, lat: 51.5, lon: -0.1 }
Consumer -> Consumer : key = "ABC123:1700000000000"
Consumer -> TSDB : INSERT ... ON CONFLICT DO NOTHING
Consumer -> Redis : HGET entity:live:ABC123 last_seen_ms -> nil\nHSET entity:live:ABC123 { lat, lon, last_seen_ms: 1700000000000 }
Consumer -> Kafka : commit offset

note over Kafka
  Consumer restarts before offset
  is durably committed. Same event
  is redelivered.
end note

Kafka -> Consumer : redeliver same event\n{ entity_id: "ABC123", timestamp_ms: 1700000000000, lat: 51.5, lon: -0.1 }
Consumer -> Consumer : key = "ABC123:1700000000000" (identical)
Consumer -> TSDB : INSERT ... ON CONFLICT DO NOTHING -> no-op
Consumer -> Redis : HGET entity:live:ABC123 last_seen_ms -> 1700000000000\ntimestamp_ms (1700000000000) <= stored (1700000000000): skip HSET
Consumer -> Kafka : commit offset

note over TSDB, Redis
  Both stores in consistent state.
  TimescaleDB: ON CONFLICT DO NOTHING silently drops duplicate row.
  Redis: timestamp guard skips the HSET when event timestamp
  is not newer than stored last_seen_ms — prevents value regression.
  No coordination between instances required.
  The Correlation Worker applies the same guarantee
  when writing PROXIMITY_EVENT edges to Neo4j
  from position.normalized.
end note

@enduml

