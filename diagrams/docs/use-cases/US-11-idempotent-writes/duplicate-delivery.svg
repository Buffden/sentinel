36; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="135.5" x2="637.5" y1="678.3359" y2="678.3359"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="147.5" y="673.27">commit offset</text><path d="M910,691.3359 L910,746.3359 L1233,746.3359 L1233,701.3359 L1223,691.3359 L910,691.3359 " fill="#FFFDE7" filter="url(#f6upin8s2irqv)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1223,691.3359 L1223,701.3359 L1233,701.3359 L1223,691.3359 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="223" x="922.5" y="708.4028">All three stores in consistent state.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="271" x="922.5" y="723.5356">No duplicate rows, edges, or keys created.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="285" x="922.5" y="738.6685">No coordination between instances required.</text><!--MD5=[e04ea3d320dca7009155cd676652867b]
@startuml duplicate-delivery
title US-11: Duplicate Delivery - Same Kafka Event Processed Twice, No Duplicates Created

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

queue "Kafka\nposition.normalized" as Kafka
participant "Position\nConsumer" as Consumer
database "TimescaleDB\nposition_history" as TSDB
database "Neo4j\nentity graph" as Neo4j
database "Redis\nentity:live:{id}" as Redis

note over Kafka
  At-least-once delivery.
  Same event can be delivered
  more than once after a
  consumer restart or rebalance.
end note

Kafka -> Consumer : deliver event\n{ entity_id: "ABC123", timestamp_ms: 1700000000000, lat: 51.5, lon: -0.1 }
Consumer -> Consumer : key = "ABC123:1700000000000"
Consumer -> TSDB : INSERT ... ON CONFLICT DO NOTHING
Consumer -> Neo4j : MERGE on idempotency_key
Consumer -> Redis : HSET entity:live:ABC123
Consumer -> Kafka : commit offset

note over Kafka
  Consumer restarts before offset
  is durably committed. Same event
  is redelivered.
end note

Kafka -> Consumer : redeliver same event\n{ entity_id: "ABC123", timestamp_ms: 1700000000000, lat: 51.5, lon: -0.1 }
Consumer -> Consumer : key = "ABC123:1700000000000" (identical)
Consumer -> TSDB : INSERT ... ON CONFLICT DO NOTHING -> no-op
Consumer -> Neo4j : MERGE on idempotency_key -> no-op
Consumer -> Redis : HSET entity:live:ABC123 -> no-op
Consumer -> Kafka : commit offset

note over TSDB, Redis
  All three stores in consistent state.
  No duplicate rows, edges, or keys created.
  No coordination between instances required.
end note

@enduml

