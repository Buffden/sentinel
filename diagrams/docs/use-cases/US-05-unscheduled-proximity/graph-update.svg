ont-size="13" lengthAdjust="spacingAndGlyphs" textLength="170" x="115" y="520.1372">lat, lon, distance_metres }</text><path d="M398.5,538.2031 L398.5,638.2031 L793.5,638.2031 L793.5,548.2031 L783.5,538.2031 L398.5,538.2031 " fill="#FFFDE7" filter="url(#fmet7j939ts97)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M783.5,538.2031 L783.5,548.2031 L793.5,548.2031 L783.5,538.2031 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="232" x="404.5" y="555.27">Published only for unscheduled pairs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="199" x="404.5" y="570.4028">(no KNOWN_ASSOCIATE edge).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="348" x="404.5" y="585.5356">Known associates: Neo4j edge written, no Kafka event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="226" x="404.5" y="600.6685">Alert Evaluator consumes this topic</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="374" x="404.5" y="615.8013">to emit UNSCHEDULED_PROXIMITY and COMPOSITE alerts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="342" x="404.5" y="630.9341">Short retention (1h) - stale candidates have no value.</text><!--MD5=[07aa68a53e23afc1f38bf0ce45d6518c]
@startuml graph-update
title US-05: Graph Update - Proximity Event Written to Neo4j and proximity.candidates Published

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Correlation\nWorker" as Correlation
database "Neo4j\nentity graph" as Neo4j
queue "Kafka\nproximity.candidates" as ProxKafka

Correlation -> Neo4j : MERGE (a:Entity {id: $id_a})\nMERGE (b:Entity {id: $id_b})

note over Neo4j
  MERGE creates the node if absent,
  matches it if already present.
  Entity nodes are never duplicated.
end note

Correlation -> Neo4j : MERGE (a)-[e:PROXIMITY_EVENT {\n  idempotency_key: $entity_a + ':' + $timestamp_ms\n}]->(b)\nON CREATE SET e.lat = $lat,\n  e.lon = $lon,\n  e.distance_metres = $distance,\n  e.timestamp_ms = $timestamp_ms

note over Neo4j
  Idempotency key on the edge.
  Replaying the same Kafka event
  produces exactly one edge - never a duplicate.
  Safe to replay from any offset.
end note

Neo4j - -> Correlation : edge created or matched (no-op on replay)

Correlation -> ProxKafka : publish proximity.candidates\n{ entity_a_id, entity_b_id, timestamp_ms,\n  lat, lon, distance_metres }

note over ProxKafka
  Published only for unscheduled pairs
  (no KNOWN_ASSOCIATE edge).
  Known associates: Neo4j edge written, no Kafka event.
  Alert Evaluator consumes this topic
  to emit UNSCHEDULED_PROXIMITY and COMPOSITE alerts.
  Short retention (1h) - stale candidates have no value.
end note

@enduml

