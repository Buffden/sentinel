: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="236" x="84" y="480.7388">Neo4j write applies to ALL close pairs</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="239" x="84" y="495.8716">(unscheduled and known associates).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="344" x="84" y="511.0044">Kafka publish below applies to unscheduled pairs only.</text><polygon fill="#A80036" points="828,590.6016,838,594.6016,828,598.6016,832,594.6016" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="262.5" x2="834" y1="594.6016" y2="594.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="182" x="269.5" y="544.1372">publish proximity.candidates</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="156" x="269.5" y="559.27">(unscheduled pairs only)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="223" x="269.5" y="574.4028">{ pair_key, entity_a_id, entity_b_id,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="326" x="277.5" y="589.5356">episode_start_ms, lat, lon, distance_at_detection }</text><path d="M646,607.6016 L646,707.6016 L1029,707.6016 L1029,617.6016 L1019,607.6016 L646,607.6016 " fill="#FFFDE7" filter="url(#fgbvs0see0rqs)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1019,607.6016 L1019,617.6016 L1029,617.6016 L1019,607.6016 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="331" x="652" y="624.6685">Published only on episode start — not on each ping.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="362" x="652" y="639.8013">Published only when no KNOWN_ASSOCIATE edge exists.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="348" x="652" y="654.9341">Known associates: Neo4j edge written, no Kafka event.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="276" x="652" y="670.0669">Alert Evaluator consumes this topic to emit</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="324" x="652" y="685.1997">UNSCHEDULED_PROXIMITY and COMPOSITE alerts.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="350" x="652" y="700.3325">Short retention (1h) — stale candidates have no value.</text><!--MD5=[6a727c90883c13a105f47756dc6c6a1f]
@startuml graph-update
title US-05: Graph Update - Proximity Event Written to Neo4j; candidate published for unscheduled pairs

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Correlation\nWorker" as Correlation
database "Neo4j\nentity graph" as Neo4j
queue "Kafka\nproximity.candidates" as ProxKafka

Correlation -> Neo4j : MERGE Entity nodes for both entities\n(creates if absent, matches if present)

note over Correlation
  pair_key = min(entity_a_id, entity_b_id) + ':' + max(entity_a_id, entity_b_id)
  episode_start_ms = position event's timestamp_ms (source event time)
  idempotency_key = {pair_key}:{episode_start_ms}
  One edge per proximity episode.
end note

Correlation -> Neo4j : MERGE PROXIMITY_EVENT edge\nidempotency_key = {idempotency_key}\nON CREATE: set episode_start_ms, distance_at_detection, lat, lon\nON MATCH: update last_seen_ms, min_distance_metres if closer

note over Neo4j
  Idempotency key = {pair_key}:{episode_start_ms}.
  Replaying the same Kafka event matches the existing edge — no duplicate.
  ON MATCH updates keep last_seen_ms and min_distance_metres
  current during an ongoing episode.
  Safe to replay from any offset.
end note

Neo4j - -> Correlation : edge created or updated

note over Correlation
  Neo4j write applies to ALL close pairs
  (unscheduled and known associates).
  Kafka publish below applies to unscheduled pairs only.
end note

Correlation -> ProxKafka : publish proximity.candidates\n(unscheduled pairs only)\n{ pair_key, entity_a_id, entity_b_id,\n  episode_start_ms, lat, lon, distance_at_detection }

note over ProxKafka
  Published only on episode start — not on each ping.
  Published only when no KNOWN_ASSOCIATE edge exists.
  Known associates: Neo4j edge written, no Kafka event.
  Alert Evaluator consumes this topic to emit
  UNSCHEDULED_PROXIMITY and COMPOSITE alerts.
  Short retention (1h) — stale candidates have no value.
end note

@enduml

