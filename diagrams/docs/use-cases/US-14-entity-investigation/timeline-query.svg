5" y="819.6279">Express API</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="91" x="998" y="101.6514">TimescaleDB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="108" x="989.5" y="117.9482">position_history</text><path d="M1028.5,52.6563 C1028.5,42.6563 1046.5,42.6563 1046.5,42.6563 C1046.5,42.6563 1064.5,42.6563 1064.5,52.6563 L1064.5,78.6563 C1064.5,88.6563 1046.5,88.6563 1046.5,88.6563 C1046.5,88.6563 1028.5,88.6563 1028.5,78.6563 L1028.5,52.6563 " fill="#FEFECE" filter="url(#f1l29hs0u3ord4)" style="stroke: #000000; stroke-width: 1.5;"/><path d="M1028.5,52.6563 C1028.5,62.6563 1046.5,62.6563 1046.5,62.6563 C1046.5,62.6563 1064.5,62.6563 1064.5,52.6563 " fill="none" style="stroke: #000000; stroke-width: 1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="91" x="998" y="812.6279">TimescaleDB</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="108" x="989.5" y="828.9248">position_history</text><path d="M1028.5,842.2266 C1028.5,832.2266 1046.5,832.2266 1046.5,832.2266 C1046.5,832.2266 1064.5,832.2266 1064.5,842.2266 L1064.5,868.2266 C1064.5,878.2266 1046.5,878.2266 1046.5,878.2266 C1046.5,878.2266 1028.5,878.2266 1028.5,868.2266 L1028.5,842.2266 " fill="#FEFECE" filter="url(#f1l29hs0u3ord4)" style="stroke: #000000; stroke-width: 1.5;"/><path d="M1028.5,842.2266 C1028.5,852.2266 1046.5,852.2266 1046.5,852.2266 C1046.5,852.2266 1064.5,852.2266 1064.5,842.2266 " fill="none" style="stroke: #000000; stroke-width: 1.5;"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="40" x="1134.5" y="101.6514">Neo4j</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="82" x="1113.5" y="117.9482">entity graph</text><path d="M1139.5,52.6