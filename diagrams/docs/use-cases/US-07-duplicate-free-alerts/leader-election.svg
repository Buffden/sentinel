 " fill="#FFFDE7" filter="url(#f1cuqiyec2rlf5)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M723,524.6719 L723,534.6719 L733,534.6719 L723,524.6719 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="226" x="419" y="541.7388">GET-then-PEXPIRE via Lua (atomic).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="231" x="419" y="556.8716">SET XX PX is NOT safe for renewal —</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="276" x="419" y="572.0044">it overwrites the key value without checking</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="227" x="419" y="587.1372">who holds it; a slow old leader could</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="299" x="419" y="602.27">accidentally steal a lease held by a new leader.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="248" x="419" y="617.4028">Lua compare-and-expire prevents this.</text><polygon fill="#A80036" points="678.5,651.6016,688.5,655.6016,678.5,659.6016,682.5,655.6016" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="102" x2="684.5" y1="655.6016" y2="655.6016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="153" x="109" y="650.5356">emit alerts (leader only)</text><!--MD5=[1ef21c3cf1a43635110981569a763a87]
@startuml leader-election
title US-07: Leader Election - One Instance Wins the Lease

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Evaluator\nInstance A" as A
participant "Evaluator\nInstance B" as B
database "Redis\nalert-evaluator:leader" as Redis
queue "Kafka\nalerts" as Kafka

note over A, B
  Both instances start simultaneously.
  Both attempt to acquire the leader lease.
end note

A -> Redis : SET alert-evaluator:leader $instance_a NX PX $TTL_MS
B -> Redis : SET alert-evaluator:leader $instance_b NX PX $TTL_MS

note over Redis
  NX = only set if key does not exist.
  PX = expire after TTL_MS milliseconds.
  Atomic. Exactly one instance wins.
end note

Redis - -> A : OK (lease acquired - Instance A is leader)
Redis - -> B : nil (lease already held - Instance B is follower)

note over B
  Follower polls the lease key.
  Runs no evaluation.
  Emits no alerts.
  Waits for the key to expire.
end note

loop every heartbeat interval (< TTL_MS)
  A -> Redis : Lua: if GET('alert-evaluator:leader') == $instance_a\nthen PEXPIRE('alert-evaluator:leader', $TTL_MS)
  note over Redis
    GET-then-PEXPIRE via Lua (atomic).
    SET XX PX is NOT safe for renewal —
    it overwrites the key value without checking
    who holds it; a slow old leader could
    accidentally steal a lease held by a new leader.
    Lua compare-and-expire prevents this.
  end note
  A -> Kafka : emit alerts (leader only)
end

@enduml

