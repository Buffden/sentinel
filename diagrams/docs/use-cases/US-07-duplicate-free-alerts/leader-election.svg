 acquisition.</text><path d="M145,418.0078 L222,418.0078 L222,425.0078 L212,435.0078 L145,435.0078 L145,418.0078 " fill="#EEEEEE" style="stroke: #000000; stroke-width: 1.0;"/><rect fill="none" height="90.5313" style="stroke: #000000; stroke-width: 2.0;" width="480.5" x="145" y="418.0078"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="32" x="160" y="431.0747">loop</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="156" x="237" y="430.2183">[heartbeat while owner]</text><polygon fill="#A80036" points="527.5,467.4063,537.5,471.4063,527.5,475.4063,531.5,471.4063" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="202" x2="533.5" y1="471.4063" y2="471.4063"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="190" x="209" y="451.2075">atomic compare-and-PEXPIRE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="175" x="209" y="466.3403">only if value == instance_A</text><polygon fill="#A80036" points="213,496.5391,203,500.5391,213,504.5391,209,500.5391" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="207" x2="538.5" y1="500.5391" y2="500.5391"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="136" x="219" y="495.4731">renewed or lease lost</text><path d="M330,520.5391 L330,575.5391 L744,575.5391 L744,530.5391 L734,520.5391 L330,520.5391 " fill="#FFFDE7" filter="url(#f1mv1nrzgstuhu)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M734,520.5391 L734,530.5391 L744,530.5391 L734,520.5391 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="276" x="336" y="537.606">Exactly one lease value can exist at a time,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="333" x="336" y="552.7388">but lease coordination is not exactly-once transport.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="393" x="336" y="567.8716">Deterministic alert identity remains required for replay safety.</text><!--MD5=[b634ac54b5b47199da8665092cde8838]
@startuml leader-election
title US-07: Leader Election - One Active Evaluator Owns Rule State

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Evaluator A" as A
participant "Evaluator B" as B
database "Redis\nalert-evaluator:leader" as Redis
queue "Kafka\ndeviation.candidates +\nproximity.candidates" as Candidates

A -> Redis : SET leader instance_A NX PX TTL
B -> Redis : SET leader instance_B NX PX TTL
Redis - -> A : OK
Redis - -> B : nil

note over A
  Lease holder becomes active evaluator.
  It creates/joins the alert-evaluator Kafka consumer group
  and also runs the scheduled signal-loss scan.
end note

A -> Candidates : join + poll evaluator consumer group

note over B
  Follower does not join/poll the evaluator consumer group
  and does not run rule evaluation.
  It only polls/attempts lease acquisition.
end note

loop heartbeat while owner
  A -> Redis : atomic compare-and-PEXPIRE\nonly if value == instance_A
  Redis - -> A : renewed or lease lost
end

note over Redis
  Exactly one lease value can exist at a time,
  but lease coordination is not exactly-once transport.
  Deterministic alert identity remains required for replay safety.
end note

@enduml

