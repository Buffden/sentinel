5" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="874" x2="1033" y1="510.375" y2="510.375"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="104" x="881" y="490.1763">position payload</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="141" x="881" y="505.3091">(XYZ123 not included)</text><polygon fill="#A80036" points="1268,535.5078,1278,539.5078,1268,543.5078,1272,539.5078" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="1039" x2="1274" y1="539.5078" y2="539.5078"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="217" x="1046" y="534.4419">entity XYZ123 removed from map</text><path d="M1001,552.5078 L1001,637.5078 L1317,637.5078 L1317,562.5078 L1307,552.5078 L1001,552.5078 " fill="#FFFDE7" filter="url(#ftsx3t10p2h3d)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1307,552.5078 L1307,562.5078 L1317,562.5078 L1307,552.5078 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="202" x="1020.25" y="569.5747">Entity disappears from the map</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="265" x="1020.25" y="584.7075">automatically when it stops broadcasting.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="196" x="1020.25" y="599.8403">No explicit delete call required.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="202" x="1020.25" y="614.9731">Same TTL expiry triggers US-03</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="134" x="1020.25" y="630.106">signal loss detection.</text><!--MD5=[211cccfe682333bac5dcc3522fc547c1]
@startuml entity-expiry
title US-01: Entity Expiry - Stale Entity Removed from Map via Redis TTL

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

collections "OpenSky / AIS\nFeed" as Feed
participant "Ingestion\nPoller" as Poller
database "Redis\nentity:live:{id}" as Redis
participant "Express API" as API
participant "Angular\nDashboard" as Dashboard
actor Operator

Feed -> Poller : position pings arriving normally
Poller -> Redis : HSET entity:live:XYZ123\n{ lat, lon, timestamp_ms }\nEXPIRE = SIGNAL_LOSS_THRESHOLD_MS

note over Feed, Poller
  Entity XYZ123 stops broadcasting.
  Feed returns no further pings for it.
end note

note over Redis
  TTL countdown begins from
  last received ping.
  No manual cleanup needed.
end note

Redis -> Redis : TTL expires\nkey entity:live:XYZ123 deleted automatically

API -> Redis : HGETALL entity:live:*\n(next dashboard refresh)
Redis - -> API : XYZ123 absent from response

API - -> Dashboard : position payload\n(XYZ123 not included)
Dashboard - -> Operator : entity XYZ123 removed from map

note over Dashboard, Operator
  Entity disappears from the map
  automatically when it stops broadcasting.
  No explicit delete call required.
  Same TTL expiry triggers US-03
  signal loss detection.
end note

@enduml

