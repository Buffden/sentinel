 font-size="13" lengthAdjust="spacingAndGlyphs" textLength="144" x="182" y="473.77">in cell 8a2a1072b58ffff</text><path d="M312,491.8359 L312,606.8359 L916,606.8359 L916,501.8359 L906,491.8359 L312,491.8359 " fill="#FFFDE7" filter="url(#fqvzczhepw007)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M906,491.8359 L906,501.8359 L916,501.8359 L906,491.8359 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="181" x="505" y="508.9028">Write load distributed across</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="169" x="505" y="524.0356">multiple chunks in parallel.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="202" x="505" y="539.1685">No single chunk is a bottleneck.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="193" x="505" y="554.3013">Compare: a single rectangular</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="205" x="505" y="569.4341">grid cell covering the same area</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="173" x="505" y="584.5669">would receive all writes into</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="164" x="505" y="599.6997">one partition - a hot-spot.</text><!--MD5=[4c29f33854c1c8a076aaebf7146539bb]
@startuml hot-spot-distribution
title US-12: Hot-Spot Distribution - High-Traffic Area Spread Across Multiple H3 Cells

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Position\nConsumer" as Consumer
database "TimescaleDB\nChunk A\n(geo_cell=8a2a1072b59ffff)" as ChunkA
database "TimescaleDB\nChunk B\n(geo_cell=8a2a1072b4fffff)" as ChunkB
database "TimescaleDB\nChunk C\n(geo_cell=8a2a1072b58ffff)" as ChunkC

note over Consumer
  Busy airspace - e.g. London Heathrow approach.
  Hundreds of aircraft in a small area.
  All pings arrive at the position consumer.
end note

Consumer -> Consumer : compute H3 cell for each ping\nat resolution 5 (~252 km² per cell)

note over Consumer
  Aircraft dispersed across the
  approach corridor map to
  different H3 cells at resolution 5.
  No single cell receives all writes.
end note

Consumer -> ChunkA : INSERT positions for aircraft\nin cell 8a2a1072b59ffff
Consumer -> ChunkB : INSERT positions for aircraft\nin cell 8a2a1072b4fffff
Consumer -> ChunkC : INSERT positions for aircraft\nin cell 8a2a1072b58ffff

note over ChunkA, ChunkC
  Write load distributed across
  multiple chunks in parallel.
  No single chunk is a bottleneck.
  Compare: a single rectangular
  grid cell covering the same area
  would receive all writes into
  one partition - a hot-spot.
end note

@enduml

