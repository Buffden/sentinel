,588.3047 L378,588.3047 " fill="#FFFDE7" filter="url(#funs37w25ebo7)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M719,588.3047 L719,598.3047 L729,598.3047 L719,588.3047 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="330" x="384" y="605.3716">Fan-out: check each active WebSocket connection's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="183" x="384" y="620.5044">saved scope before pushing.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="306" x="384" y="635.6372">geo_region bounds + entity_type + COMPOSITE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="251" x="384" y="650.77">must all match the connection's scope.</text><polygon fill="#A80036" points="950,700.1016,960,704.1016,950,708.1016,954,704.1016" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="555.5" x2="956" y1="704.1016" y2="704.1016"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="242" x="562.5" y="683.9028">push composite alert over WebSocket</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="280" x="562.5" y="699.0356">(only to connections whose scope matches)</text><polygon fill="#A80036" points="1197,759.5,1207,763.5,1197,767.5,1201,763.5" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="962" x2="1203" y1="763.5" y2="763.5"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="193" x="969" y="728.1685">single elevated alert displayed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="223" x="969" y="743.3013">(signal loss + proximity correlated)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="77" x="969" y="758.4341">status: NEW</text><path d="M924,776.5 L924,846.5 L1246,846.5 L1246,786.5 L1236,776.5 L924,776.5 " fill="#FFFDE7" filter="url(#funs37w25ebo7)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1236,776.5 L1236,786.5 L1246,786.5 L1236,776.5 " fill="#FFFDE7" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="197" x="952.25" y="793.5669">Operator sees one notification,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="51" x="952.25" y="808.6997">not two.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="210" x="952.25" y="823.8325">Priority is visually elevated above</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="253" x="952.25" y="838.9653">individual signal loss or proximity alerts.</text><!--MD5=[0bc20a272bd2c1a98f28e8849b803c7d]
@startuml composite-emission
title US-06: Composite Emission - One Alert Persisted and Pushed, Individual Alerts Suppressed

skinparam sequenceArrowThickness 1.5
skinparam participantBorderColor #555555
skinparam participantBackgroundColor #F8F8F8
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FFFDE7

participant "Alert\nEvaluator\n(leader)" as Evaluator
queue "Kafka\nalerts" as Kafka
participant "Express API" as API
database "TimescaleDB\nalerts table" as TSDB
participant "Angular\nDashboard" as Dashboard
actor Operator

Evaluator -> Kafka : publish ONE composite alert\n{ alert_id, alert_type: COMPOSITE,\n  priority: ELEVATED,\n  entity_b: signal loss,\n  entity_a: unrelated proximity,\n  correlation_window_ms,\n  window_start_ms,\n  location, timestamp_ms }

note over Evaluator
  Individual SIGNAL_LOSS and
  UNSCHEDULED_PROXIMITY alerts
  for this event are NOT emitted.
  The composite replaces both.
end note

Kafka -> API : consume composite alert

API -> TSDB : INSERT INTO alerts\n( alert_id, entity_id, alert_type: COMPOSITE,\n  status: NEW, detected_at, payload )\nON CONFLICT (alert_id) DO NOTHING

note over TSDB
  Composite alert stored as a single row.
  alert_id = {entity_id}:COMPOSITE:{window_start_ms}
  Idempotent - safe under Kafka replay.
  Operator can acknowledge and resolve it
  via the same lifecycle flow as any alert (US-13).
end note

TSDB - -> API : inserted (or conflict - no-op)

note over API
  Fan-out: check each active WebSocket connection's
  saved scope before pushing.
  geo_region bounds + entity_type + COMPOSITE
  must all match the connection's scope.
end note

API - -> Dashboard : push composite alert over WebSocket\n(only to connections whose scope matches)

Dashboard - -> Operator : single elevated alert displayed\n(signal loss + proximity correlated)\nstatus: NEW

note over Dashboard, Operator
  Operator sees one notification,
  not two.
  Priority is visually elevated above
  individual signal loss or proximity alerts.
end note

@enduml

