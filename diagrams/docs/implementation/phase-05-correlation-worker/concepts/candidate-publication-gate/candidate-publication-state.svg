<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="856px" preserveAspectRatio="none" style="width:1393px;height:856px;background:#FFFFFF;" version="1.1" viewBox="0 0 1393 856" width="1393px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="580.1318" x="403.3926" y="23.5352">Candidate Publication Gate &#8212; proximity-episode:{pair_key} candidate_published</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="9" id="ent0001"><ellipse cx="441.56" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="NO_EPISODE" data-source-line="9" id="ent0002"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="104.0684" x="389.52" y="124.4883"/><line style="stroke:#555555;stroke-width:0.5;" x1="389.52" x2="493.5884" y1="150.9766" y2="150.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="84.0684" x="399.52" y="143.0234">NO_EPISODE</text></g><g class="entity" data-qualified-name="NEW_EPISODE" data-source-line="11" id="ent0004"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="112.7568" x="385.18" y="281.4883"/><line style="stroke:#555555;stroke-width:0.5;" x1="385.18" x2="497.9368" y1="307.9766" y2="307.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="92.7568" x="395.18" y="300.0234">NEW_EPISODE</text></g><g class="entity" data-qualified-name="KNOWN_ASSOCIATE" data-source-line="13" id="ent0006"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="155.1123" x="7" y="488.0683"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="162.1123" y1="514.5566" y2="514.5566"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="135.1123" x="17" y="506.6034">KNOWN_ASSOCIATE</text></g><g class="entity" data-qualified-name="PENDING" data-source-line="14" id="ent0008"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="80.6484" x="760.23" y="488.0683"/><line style="stroke:#555555;stroke-width:0.5;" x1="760.23" x2="840.8784" y1="514.5566" y2="514.5566"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60.6484" x="770.23" y="506.6034">PENDING</text></g><g class="entity" data-qualified-name="PUBLISHED" data-source-line="16" id="ent0010"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="92.8916" x="622.11" y="678.6583"/><line style="stroke:#555555;stroke-width:0.5;" x1="622.11" x2="715.0016" y1="705.1466" y2="705.1466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="72.8916" x="632.11" y="697.1934">PUBLISHED</text></g><g class="end_entity" data-qualified-name=".end." data-source-line="21" id="ent0014"><ellipse cx="377.56" cy="831.6583" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="377.56" cy="831.6583" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN17" data-source-line="25" id="ent0018"><path d="M442.26,454.4883 L442.26,509.0683 L162.52,513.0683 L442.26,517.0683 L442.26,571.6621 A0,0 0 0 0 442.26,571.6621 L724.8596,571.6621 A0,0 0 0 0 724.8596,571.6621 L724.8596,464.4883 L714.8596,454.4883 L442.26,454.4883 A0,0 0 0 0 442.26,454.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M714.8596,454.4883 L714.8596,464.4883 L724.8596,464.4883 L714.8596,454.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.2788" x="448.26" y="472.0566">No dedicated boolean field for this.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.4585" x="448.26" y="487.3672">candidate_published is simply never</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.5996" x="448.26" y="502.6777">written for a known-associate episode --</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="237.3643" x="448.26" y="517.9883">its ABSENCE on an existing episode is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="223.8755" x="448.26" y="533.2988">what means "already established as</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="216.4487" x="448.26" y="548.6094">known associate," distinct from '0'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.0659" x="448.26" y="563.9199">(unscheduled, not yet published).</text></g><g class="entity" data-qualified-name="GMN20" data-source-line="35" id="ent0021"><path d="M1072.19,469.7983 L1072.19,509.0683 L841.23,513.0683 L1072.19,517.0683 L1072.19,556.351 A0,0 0 0 0 1072.19,556.351 L1378.9171,556.351 A0,0 0 0 0 1378.9171,556.351 L1378.9171,479.7983 L1368.9171,469.7983 L1072.19,469.7983 A0,0 0 0 0 1072.19,469.7983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M1368.9171,469.7983 L1368.9171,479.7983 L1378.9171,479.7983 L1368.9171,469.7983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="218.9751" x="1078.19" y="487.3666">Written before the Kafka publish is</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.1855" x="1078.19" y="502.6772">even attempted. A crash here leaves</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.7271" x="1078.19" y="517.9877">candidate_published='0' -- indistinguishable</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.2593" x="1078.19" y="533.2983">from "never tried," so the next confirming</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.4209" x="1078.19" y="548.6088">ping retries correctly.</text></g><!--link *start* to NO_EPISODE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk3"><path d="M441.56,63.8383 C441.56,77.7683 441.56,99.4383 441.56,119.1283" fill="none" id="*start*-to-NO_EPISODE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="441.56,124.1283,445.56,115.1283,441.56,119.1283,437.56,115.1283,441.56,124.1283" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NO_EPISODE to NEW_EPISODE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk5"><path d="M441.56,174.6983 C441.56,203.7383 441.56,247.1083 441.56,276.1783" fill="none" id="NO_EPISODE-to-NEW_EPISODE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="441.56,281.1783,445.56,272.1783,441.56,276.1783,437.56,272.1783,441.56,281.1783" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104.9775" x="466.5161" y="218.0566">confirming ping,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="123.8936" x="457.058" y="233.3672">no existing episode</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.8896" x="442.56" y="248.6777">(touchProximityEpisode)</text></g><!--link NEW_EPISODE to KNOWN_ASSOCIATE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="13" id="lnk7"><path d="M398.85,331.9583 C330.09,371.3583 199.9881,445.9221 131.3781,485.2421" fill="none" id="NEW_EPISODE-to-KNOWN_ASSOCIATE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="127.04,487.7283,136.8375,486.7237,131.3781,485.2421,132.8597,479.7827,127.04,487.7283" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.8008" x="346.81" y="383.0566">KNOWN_ASSOCIATE check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="161.8335" x="348.7936" y="398.3672">(Neo4j, once per episode)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="135.167" x="362.1269" y="413.6777">-- relationship exists</text></g><!--link NEW_EPISODE to PENDING--><g class="link" data-entity-1="ent0004" data-entity-2="ent0008" data-link-type="dependency" data-source-line="14" id="lnk9"><path d="M498.4,328.6983 C561.29,353.6183 664.11,398.7083 742.56,454.4883 C755.97,464.0183 765.7166,473.0941 776.1066,484.1541" fill="none" id="NEW_EPISODE-to-PENDING" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="779.53,487.7983,776.2832,478.5,776.1066,484.1541,770.4525,483.9775,779.53,487.7983" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.8008" x="727.7949" y="375.0566">KNOWN_ASSOCIATE check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="114.1309" x="753.6298" y="390.3672">-- no relationship</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.9551" x="725.2177" y="405.6777">(candidate_published = '0',</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="241.7505" x="689.82" y="420.9883">set BEFORE the Kafka publish attempt)</text></g><!--link PENDING to PUBLISHED--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" data-link-type="dependency" data-source-line="16" id="lnk11"><path d="M783.57,538.3383 C758.29,574.4483 713.9172,637.8621 688.5572,674.0921" fill="none" id="PENDING-to-PUBLISHED" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="685.69,678.1883,694.128,673.1089,688.5572,674.0921,687.5741,668.5213,685.69,678.1883" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.979" x="782.0552" y="615.2266">Kafka publish</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.3579" x="758.3657" y="630.5372">confirmed successful</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.0693" x="739.51" y="645.8477">(candidate_published = '1')</text></g><!--link PENDING to PENDING--><g class="link" data-entity-1="ent0008" data-entity-2="ent0008" data-link-type="dependency" data-source-line="17" id="lnk12"><path d="M841.24,492.4283 C859.77,490.3183 875.88,497.1983 875.88,513.0683 C875.88,528.9383 864.7379,536.394 846.2079,534.284" fill="none" id="PENDING-to-PENDING" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="841.24,533.7183,849.7297,538.7108,846.2079,534.284,850.6348,530.7622,841.24,533.7183" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.4521" x="896.5494" y="503.1366">later confirming ping,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="166.791" x="881.88" y="518.4472">publish still not confirmed</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="48.6929" x="940.9291" y="533.7577">-- retry</text></g><!--link KNOWN_ASSOCIATE to KNOWN_ASSOCIATE--><g class="link" data-entity-1="ent0006" data-entity-2="ent0006" data-link-type="dependency" data-source-line="19" id="lnk13"><path d="M162.41,492.3083 C182.23,493.6683 197.11,500.5883 197.11,513.0683 C197.11,525.5483 187.2181,532.1235 167.3981,533.4935" fill="none" id="KNOWN_ASSOCIATE-to-KNOWN_ASSOCIATE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="162.41,533.8383,171.6644,537.2081,167.3981,533.4935,171.1127,529.2272,162.41,533.8383" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.3389" x="244.119" y="503.1366">later confirming ping</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.8701" x="220.3534" y="518.4472">-- candidate_published field</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="215.3569" x="203.11" y="533.7577">stays absent, never checked again</text></g><!--link PUBLISHED to *end*--><g class="link" data-entity-1="ent0010" data-entity-2="ent0014" data-link-type="dependency" data-source-line="21" id="lnk15"><path d="M621.8,724.8983 C551.75,755.2283 428.4783,808.6115 392.0583,824.3815" fill="none" id="PUBLISHED-to-*end*" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="387.47,826.3683,397.3184,826.4628,392.0583,824.3815,394.1396,819.1214,387.47,826.3683" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.5234" x="541.48" y="772.2266">TTL gap expires,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.4526" x="552.5154" y="787.5372">episode ends</text></g><!--link KNOWN_ASSOCIATE to *end*--><g class="link" data-entity-1="ent0006" data-entity-2="ent0014" data-link-type="dependency" data-source-line="22" id="lnk16"><path d="M107.06,538.3883 C167.9,604.1183 330.1339,779.4186 366.8739,819.1186" fill="none" id="KNOWN_ASSOCIATE-to-*end*" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="370.27,822.7883,367.0928,813.466,366.8739,819.1186,361.2213,818.8997,370.27,822.7883" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="105.5234" x="280.09" y="701.2266">TTL gap expires,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="83.4526" x="291.1254" y="716.5372">episode ends</text></g><?plantuml-src ZLJTRjCm5BxFKnoLYwsecK20G9E6r9zqL4nfHOTsGL7b9YUDQMf7jhCjGaWy14_8at3i9AMacKGgLQtz-Nm_vpY6cmnXp4JCOsOG5iKcun4pN0gujWk_V_w2NCb7lkUcz37dMiPu-JrdNArtMFw0g3cxpkrPdMBiUNh7HSuKsuCsj3MIAaOrbfbKyEoDUquWBDfjbIn4NCEcx-od3Hig9Hzgn2lt7264R54DtTD6d31DfvFWhUTzUVuLVFyzXFDri9WjvvF0y_x-hhQ2kyF_IuYaIBZQSx65dBu6Ao4au2FNnYxLMQt4kP55b2wQ48DglK_5ZwhPwX_3-Lsu7YwNy_5iU6iPsYjHYj6EAeOeNtyRW1GHGewguUglXE-3mimrKASyh-Je4wf544vcuVNJ55I7p1oN8jgENiCLdBqu8-iQ3Oo2wVnJ02P5-CYI7OCQ1imOtEU6F3V4JiJdqSri-I6OM1d7-9MeewNwkeWYr3efigS5l3ph_rluu8xaKpodZMg4KQkop8u571Zh38qgFQyTJdUNEabScIwz2SUCI6YSImrier6O0GYyjoLizWHXMyO5PNN8n_BQyRo4sziRs3BRrvmhr6IbxZsWY7MduFywwDch0OflKmCoQPlq0489CSRstK02Dr9co4Jb1HAwHIRb-e9WNOwv1ittULPMDWdre3XDX70d6Uo4V10-qrf6tBvp6c6-Jr1kD0n7oo0S1pJlGAJj6qRrRScK6TYJA0qzbYbaSGb88JSYc0Kv9ZWm3NeGkrgHWKJ9lHrbGfqNGbChuYB3UE26ewJXFlZfNtWKcNkNj6Eh1uzgtDKEDqWUiUDA