e&#160;count&#160;stays&#160;at&#160;1;&#160;nothing&#160;corrupts.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="911.9844" x="0" y="498.7188"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="911.9844" y1="498.7188" y2="498.7188"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="911.9844" y1="501.7188" y2="501.7188"/><rect fill="#EEEEEE" height="21.9688" style="stroke:#000000;stroke-width:2;" width="454.7012" x="228.6416" y="488.7344"/><text fill="#000000" font-family="monospace" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="433.4766" x="234.6416" y="503.873">KNOWN_ASSOCIATE&#160;existence&#160;read&#160;--&#160;undirected,&#160;no&#160;such&#160;hazard</text><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="39" id="msg7"><polygon fill="#181818" points="580.2949,550.6406,590.2949,554.6406,580.2949,558.6406,584.2949,554.6406" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;" x1="55.3477" x2="586.2949" y1="554.6406" y2="554.6406"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="455.1504" x="62.3477" y="535.8418">MATCH&#160;(a:Entity{id:"A"})-[k:KNOWN_ASSOCIATE]-(b:Entity{id:"B"})</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="57.7969" x="62.3477" y="549.8105">RETURN&#160;k</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="40" id="msg8"><polygon fill="#181818" points="66.3477,592.5781,56.3477,596.5781,66.3477,600.5781,62.3477,596.5781" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;stroke-dasharray:2,2;" x1="60.3477" x2="591.2949" y1="596.5781" y2="596.5781"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="202.2891" x="72.3477" y="577.7793">found&#160;--&#160;regardless&#160;of&#160;which</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="195.0645" x="72.3477" y="591.748">direction&#160;it&#160;was&#160;created&#160;in</text></g><path d="M20,609.5781 L20,716.5781 L627,716.5781 L627,619.5781 L617,609.5781 L20,609.5781" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M617,609.5781 L617,619.5781 L627,619.5781 L617,609.5781" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="160.2368" y="625.7168">Direction&#160;only&#160;matters&#160;for&#160;MERGE's</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="160.2368" y="639.6855">create-or-match&#160;write.&#160;A&#160;plain&#160;existence</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="245.6367" x="160.2368" y="653.6543">read&#160;has&#160;no&#160;such&#160;pattern-direction</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="317.8828" x="160.2368" y="667.623">constraint&#160;--&#160;this&#160;is&#160;why&#160;canonicalPairKey's</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="317.8828" x="160.2368" y="681.5918">ordering&#160;discipline&#160;is&#160;required&#160;before&#160;every</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="281.7598" x="160.2368" y="695.5605">PROXIMITY_EVENT&#160;write,&#160;but&#160;not&#160;before&#160;a</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="151.7168" x="160.2368" y="709.5293">KNOWN_ASSOCIATE&#160;read.</text><?plantuml-src jLNRRjj647tdLmoSXpg0ACIz0AaA6Q0PEXLSKuAaDYtgG5YJ8t6ZrIwpkxAg107o4Vd2VabdbhewSj6NqZPWI8UpPyu