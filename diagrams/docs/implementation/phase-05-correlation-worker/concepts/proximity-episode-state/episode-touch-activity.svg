5; stroke-width: 1.5;" x1="204.5" x2="148" y1="556.5273" y2="556.5273"/><line style="stroke: #555555; stroke-width: 1.5;" x1="148" x2="148" y1="556.5273" y2="578.5273"/><polygon fill="#555555" points="144,568.5273,148,578.5273,152,568.5273,148,572.5273" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="516.5" x2="573" y1="556.5273" y2="556.5273"/><line style="stroke: #555555; stroke-width: 1.5;" x1="573" x2="573" y1="556.5273" y2="588.6602"/><polygon fill="#555555" points="569,578.6602,573,588.6602,577,578.6602,573,582.6602" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="148" x2="148" y1="613.6602" y2="651.9258"/><line style="stroke: #555555; stroke-width: 1.5;" x1="148" x2="348.5" y1="651.9258" y2="651.9258"/><polygon fill="#555555" points="338.5,647.9258,348.5,651.9258,338.5,655.9258,342.5,651.9258" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="573" x2="573" y1="623.793" y2="651.9258"/><line style="stroke: #555555; stroke-width: 1.5;" x1="573" x2="372.5" y1="651.9258" y2="651.9258"/><polygon fill="#555555" points="382.5,647.9258,372.5,651.9258,382.5,655.9258,378.5,651.9258" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="360.5" x2="360.5" y1="663.9258" y2="683.9258"/><polygon fill="#555555" points="356.5,673.9258,360.5,683.9258,364.5,673.9258,360.5,677.9258" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="360.5" x2="360.5" y1="734.1914" y2="754.1914"/><polygon fill="#555555" points="356.5,744.1914,360.5,754.1914,364.5,744.1914,360.5,748.1914" style="stroke: #555555; stroke-width: 1.0;"/><line style="stroke: #555555; stroke-width: 1.5;" x1="360.5" x2="360.5" y1="804.457" y2="824.457"/><polygon fill="#555555" points="356.5,814.457,360.5,824.457,364.5,814.457,360.5,818.457" style="stroke: #555555; stroke-width: 1.0;