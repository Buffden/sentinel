.5,598.3438" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="211.5" x2="516.5" y1="598.3438" y2="598.3438"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="287" x="223.5" y="593.5137">200 [...every fetched row, unfiltered...]</text><path d="M522,611.3438 L522,690.3438 L802,690.3438 L802,621.3438 L792,611.3438 L522,611.3438 " fill="#FAFAFA" filter="url(#fszqv25gdxxvz)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M792,611.3438 L792,621.3438 L802,621.3438 L792,611.3438 " fill="#FAFAFA" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="252" x="528" y="627.4824">Transitional: nothing sends bbox yet</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="252" x="528" y="641.4512">(dashboard alert widget doesn't pass</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="259" x="528" y="655.4199">the map viewport until CP5's frontend</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="245" x="528" y="669.3887">work wires it up). Safe fallback --</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="238" x="528" y="683.3574">matches today's existing behavior.</text><path d="M472,719.1875 L472,812.1875 L1081,812.1875 L1081,729.1875 L1071,719.1875 L472,719.1875 " fill="#FAFAFA" filter="url(#fszqv25gdxxvz)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M1071,719.1875 L1071,729.1875 L1081,729.1875 L1071,719.1875 " fill="#FAFAFA" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="343" x="581" y="735.3262">Position alw