36; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="168" x="638" y="603.5137">close the OLD connection</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="217" x="638" y="617.4824">(its close handler sees a stale</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="196" x="638" y="631.4512">generation and does nothing)</text><polygon fill="#A80036" points="65,687.2188,55,691.2188,65,695.2188,61,691.2188" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="59" x2="630" y1="691.2188" y2="691.2188"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="280" x="71" y="672.4199">onReconnect() fires (existing mechanism,</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="217" x="71" y="686.3887">unchanged since before CP3/CP4)</text><path d="M59,704.2188 L59,783.2188 L339,783.2188 L339,714.2188 L329,704.2188 L59,704.2188 " fill="#FAFAFA" filter="url(#f11jsqrs2tu5d6)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M329,704.2188 L329,714.2188 L339,714.2188 L329,704.2188 " fill="#FAFAFA" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="231" x="65" y="720.3574">Every widget already listening to</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="252" x="65" y="734.3262">onReconnect (MapWidget, AlertWidget)</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="259" x="65" y="748.2949">re-hydrates via REST and re-sends its</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="231" x="65" y="762.2637">bbox subscribe -- CP4 adds no new</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="217" x="65" y="776.2324">"restore" code, it reuses this.</text><!--MD5=[4c0b7a4b6bb092f20cd5e32a29b6b3d9]
@startuml workspace-reconnect-flow
title Reconnect-on-Save, Not Hot-Swap (CP4)

skinparam defaultFontName Monospaced
skinparam defaultFontSize 12
skinparam sequenceArrowThickness 1.5
skinparam sequenceParticipantBorderColor #888888
skinparam sequenceLifeLineBorderColor #AAAAAA
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FAFAFA
skinparam sequenceGroupBorderColor #CCCCCC
skinparam sequenceGroupBodyBackgroundColor #FAFAFA

actor Operator as Op
participant "saveWorkspaceScope()\n(dashboard, CP4)" as Save #E0E7FF
participant "liveSocket.ts\n(dashboard, CP4 adds\nforceReconnect)" as Sock #DBEAFE
participant "API" as API #DBEAFE
database "user_workspaces" as DB #FEF9C3

Op -> Save : (future CP5 UI) submits an edited scope
Save -> API : PUT /users/me/workspace { ...new scope }
API -> DB : INSERT ... ON CONFLICT DO UPDATE
DB - -> API : row written
API - -> Save : 200 { scope }

alt save failed (4xx/5xx)
  Save -> Save : throw - - forceReconnect() never called
  note right of Save
    The existing connection, and whatever scope
    it already loaded, is left completely alone.
    A failed save must never disturb a working
    connection.
  end note
else save succeeded
  Save -> Sock : forceReconnect()
  Sock -> Sock : bump generation, open a NEW connection\n(old one not yet closed)
  Sock -> API : new WebSocket upgrade (same sentinel_jwt cookie)
  API -> DB : SELECT scope WHERE user_id = ... (CP3's existing connection-open load)
  DB - -> API : the just-saved scope
  Sock -> Sock : close the OLD connection\n(its close handler sees a stale\ngeneration and does nothing)
  Sock -> Op : onReconnect() fires (existing mechanism,\nunchanged since before CP3/CP4)
  note right of Op
    Every widget already listening to
    onReconnect (MapWidget, AlertWidget)
    re-hydrates via REST and re-sends its
    bbox subscribe - - CP4 adds no new
    "restore" code, it reuses this.
  end note
end

@enduml

