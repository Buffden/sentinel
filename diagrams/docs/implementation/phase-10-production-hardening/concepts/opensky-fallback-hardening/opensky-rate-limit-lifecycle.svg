<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="500px" preserveAspectRatio="none" style="width:780px;height:500px;background:#FFFFFF;" version="1.1" viewBox="0 0 780 500" width="780px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="357.4512" x="208.2224" y="23.5352">OpenSky poller: rate-limit lifecycle (planNextPoll)</text></g><g class="entity" data-qualified-name="POLLING" data-source-line="10" id="ent0001"><rect fill="#F8F8F8" height="52.9766" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="223.123" x="107.35" y="140.4883"/><line style="stroke:#555555;stroke-width:0.5;" x1="107.35" x2="330.473" y1="166.9766" y2="166.9766"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.0371" x="189.893" y="159.0234">POLLING</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="203.123" x="112.35" y="185.5117">next request after the interval</text></g><g class="entity" data-qualified-name="PAUSED" data-source-line="11" id="ent0002"><rect fill="#F8F8F8" height="52.9766" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="267.8096" x="85" y="300.4683"/><line style="stroke:#555555;stroke-width:0.5;" x1="85" x2="352.8096" y1="326.9566" y2="326.9566"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.7119" x="192.5488" y="319.0034">PAUSED</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="247.8096" x="90" y="345.4917">one timer, no requests while waiting</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="13" id="ent0003"><ellipse cx="218.91" cy="53.4883" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN10" data-source-line="23" id="ent0011"><path d="M6,414.4483 L6,485.6905 A0,0 0 0 0 6,485.6905 L431.8154,485.6905 A0,0 0 0 0 431.8154,485.6905 L431.8154,424.4483 L421.8154,414.4483 L222.91,414.4483 L218.91,353.9383 L214.91,414.4483 L6,414.4483 A0,0 0 0 0 6,414.4483" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M421.8154,414.4483 L421.8154,424.4483 L431.8154,424.4483 L421.8154,414.4483" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.0386" x="12" y="432.0166">How long to wait after a 429</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="374.9624" x="12" y="447.3272">valid retry header: the longer of the header and the interval</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404.8154" x="12" y="462.6377">no usable header: 60 s floor, doubling ceiling, 15 min cap, jitter</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.9512" x="12" y="477.9483">only a 200 resets the fallback count</text></g><!--link *start* to POLLING--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" data-link-type="dependency" data-source-line="13" id="lnk4"><path d="M218.91,63.6183 C218.91,80.1583 218.91,110.6383 218.91,135.1483" fill="none" id="*start*-to-POLLING" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="218.91,140.1483,222.91,131.1483,218.91,135.1483,214.91,131.1483,218.91,140.1483" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="211.4912" x="219.91" y="107.0566">startup, first request immediately</text></g><!--link POLLING to POLLING--><g cla