; stroke-width: 1.5;" x1="70.5" x2="410.5" y1="491.2188" y2="491.2188"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="98" x="77.5" y="458.4512">FINALIZE (Lua)</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="294" x="77.5" y="472.4199">SAME KEYS = [alert-state:X, recent-loss:X]</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="322" x="77.5" y="486.3887">same expected dark_since_ms, same candidate_id</text><path d="M421,504.2188 L421,611.2188 L736,611.2188 L736,514.2188 L726,504.2188 L421,504.2188 " fill="#FAFAFA" filter="url(#f1jeirg96xjn6p)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M726,504.2188 L726,514.2188 L736,514.2188 L726,504.2188 " fill="#FAFAFA" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="280" x="427" y="520.3574">One script call: alert-state:X no longer</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="294" x="427" y="534.3262">has a dark_since_ms match (key is gone) --</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="266" x="427" y="548.2949">the SAME call falls through and checks</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="280" x="427" y="562.2637">recent-loss:X, finds the match, confirms</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="259" x="427" y="576.2324">the claim, sets composite_issued='1'.</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="280" x="427" y="590.2012">Not two round-trips -- one atomic script</text><text fill="#000000" font-family="monospac