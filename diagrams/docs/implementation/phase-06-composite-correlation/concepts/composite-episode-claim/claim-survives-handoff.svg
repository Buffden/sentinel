style="stroke:#888888;stroke-width:0.5;" width="136.8184" x="725.8887" y="715.2031"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="122.8184" x="732.8887" y="733.3418">Position&#160;Consumer</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="17" id="msg1"><polygon fill="#181818" points="411.5166,125.1719,421.5166,129.1719,411.5166,133.1719,415.5166,129.1719" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;" x1="67.1846" x2="417.5166" y1="129.1719" y2="129.1719"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="79.4707" x="74.1846" y="96.4043">CLAIM&#160;(Lua)</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="74.1846" y="110.373">KEYS&#160;=&#160;[alert-state:X,&#160;recent-loss:X]</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="74.1846" y="124.3418">expected&#160;dark_since_ms,&#160;candidate_id</text></g><path d="M428,142.1719 L428,221.1719 L752,221.1719 L752,152.1719 L742,142.1719 L428,142.1719" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M742,142.1719 L742,152.1719 L752,152.1719 L742,142.1719" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="434" y="158.3105">Script&#160;checks&#160;alert-state:X&#160;first,&#160;finds&#160;a</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="434" y="172.2793">dark_since_ms&#160;match,&#160;composite_issued='0',</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="209.5137" x="434" y="186.248">no&#160;existing&#160;claim&#160;-&gt;&#160;SUCCESS.</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="252.8613" x="434" y="200.2168">composite_claim_candidate_id&#160;set&#160;on</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="281.7598" x="434" y="214.1855">alert-state:X,&#160;in&#160;the&#160;SAME&#160;script&#160;call.</text><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="26" id="msg2"><polygon fill="#181818" points="78.1846,242.9844,68.1846,246.9844,78.1846,250.9844,74.1846,246.9844" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;stroke-dasharray:2,2;" x1="72.1846" x2="422.5166" y1="246.9844" y2="246.9844"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="101.1445" x="84.1846" y="242.1543">claimed&#160;=&#160;true</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" data-source-line="28" id="msg3"><polygon fill="#181818" points="434.5166,298.8906,424.5166,302.8906,434.5166,306.8906,430.5166,302.8906" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;" x1="428.5166" x2="793.2979" y1="302.8906" y2="302.8906"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="440.5166" y="270.123">entity&#160;resumes&#160;--&#160;CP3A&#160;atomic&#160;handoff</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="346.7813" x="440.5166" y="284.0918">(unrelated&#160;trigger:&#160;whenever&#160;the&#160;entity&#160;resumes,</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="252.8613" x="440.5166" y="298.0605">not&#160;in&#160;response&#160;to&#160;the&#160;claim&#160;above)</text></g><path d="M428,315.8906 L428,436.8906 L745,436.8906 L745,325.8906 L735,315.8906 L428,315.8906" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M735,315.8906 L735,325.8906 L745,325.8906 L735,315.8906" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="260.0859" x="434" y="332.0293">One&#160;Lua&#160;script&#160;transfers&#160;ALL&#160;current</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="238.4121" x="434" y="345.998">alert-state:X&#160;fields&#160;--&#160;including</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="231.1875" x="434" y="359.9668">composite_claim_candidate_id&#160;and</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="281.7598" x="434" y="373.9355">composite_issued&#160;--&#160;into&#160;recent-loss:X,</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="296.209" x="434" y="387.9043">then&#160;deletes&#160;alert-state:X.&#160;The&#160;claim&#160;set</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="296.209" x="434" y="401.873">above&#160;is&#160;carried&#160;forward&#160;unconditionally;</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="274.5352" x="434" y="415.8418">this&#160;script&#160;does&#160;not&#160;interpret&#160;it&#160;(see</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="202.2891" x="434" y="429.8105">atomic-signal-loss-handoff).</text><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="41" id="msg4"><polygon fill="#181818" points="411.5166,486.5469,421.5166,490.5469,411.5166,494.5469,415.5166,490.5469" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1.5;" x1="67.1846" x2="417.5166" y1="490.5469" y2="490.5469"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="101.1445" x="74.1846" y="457.7793">FINALIZE&#160;(Lua)</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="74.1846" y="471.748">SAME&#160;KEYS&#160;=&#160;[alert-state:X,&#160;recent-loss:X]</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="332.332" x="74.1846" y="485.7168">same&#160;expected&#160;dark_since_ms,&#160;same&#160;candidate_id</text></g><path d="M428,503.5469 L428,610.5469 L752,610.5469 L752,513.5469 L742,503.5469 L428,503.5469" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M742,503.5469 L742,513.5469 L752,513.5469 L742,503.5469" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="434" y="519.6855">One&#160;script&#160;call:&#160;alert-state:X&#160;no&#160;longer</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="303.4336" x="434" y="533.6543">has&#160;a&#160;dark_since_ms&#160;match&#160;(key&#160;is&#160;gone)&#160;--</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="274.5352" x="434" y="547.623">the&#160;SAME&#160;call&#160;falls&#160;through&#160;and&#160;checks</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="288.9844" x="434" y="561.5918">recent-loss:X,&#160;finds&#160;the&#160;match,&#160;confirms</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" textLength="267.3105" x="434" y="575.5605">the&#160;claim,&#160;sets&#160;composite_issued='1'.</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacing" tex