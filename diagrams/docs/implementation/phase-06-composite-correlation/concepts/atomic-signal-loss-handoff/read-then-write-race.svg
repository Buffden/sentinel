space" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="322" x="98.5" y="411.6074">composite_claim_candidate_id = ""  (* stale *)</text><polygon fill="#A80036" points="425.5,440.4063,435.5,444.4063,425.5,448.4063,429.5,444.4063" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="91.5" x2="431.5" y1="444.4063" y2="444.4063"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="105" x="98.5" y="439.5762">DEL alert-state</text><polygon fill="#A80036" points="102.5,475.375,92.5,479.375,102.5,483.375,98.5,479.375" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.5; stroke-dasharray: 2.0,2.0;" x1="96.5" x2="436.5" y1="479.375" y2="479.375"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="28" x="108.5" y="474.5449">done</text><path d="M299,492.375 L299,571.375 L572,571.375 L572,502.375 L562,492.375 L299,492.375 " fill="#FAFAFA" filter="url(#fgujlfdhn0qwn)" style="stroke: #AAAAAA; stroke-width: 1.0;"/><path d="M562,492.375 L562,502.375 L572,502.375 L562,492.375 " fill="#FAFAFA" style="stroke: #AAAAAA; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="189" x="305" y="508.5137">recent-loss now exists with</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="231" x="305" y="522.4824">composite_claim_candidate_id = ""</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="238" x="305" y="536.4512">Candidate Y's claim, written AFTER</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="231" x="305" y="550.4199">the HGETALL but BEFORE the MULTI,</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="252" x="305" y="564.3887">is gone -- lost, not merely delayed.</text><!--MD5=[ffc34c38d036d7e2547de9b337e32bdc]
@startuml read-then-write-race
title Why CP1's Read-Then-MULTI-Write Handoff Loses a Claim

skinparam defaultFontName Monospaced
skinparam defaultFontSize 12
skinparam sequenceArrowThickness 1.5
skinparam sequenceParticipantBorderColor #888888
skinparam sequenceLifeLineBorderColor #AAAAAA
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FAFAFA
skinparam sequenceGroupBorderColor #CCCCCC
skinparam sequenceGroupBodyBackgroundColor #FAFAFA

participant "Position Consumer" as PC #DBEAFE
participant "Redis\nalert-state:{entity_id}" as Redis #FEF9C3
participant "Alert Evaluator" as AE #D1FAE5

PC -> Redis : HGETALL alert-state
Redis - -> PC : composite_claim_candidate_id = ""

note right of PC
  Snapshot taken. This value is now
  stale the instant it's read - - nothing
  stops another client from writing
  alert-state before the MULTI below runs.
end note

AE -> Redis : CLAIM (Lua, atomic)\ncandidate_id = "Y"
Redis - -> AE : claimed\ncomposite_claim_candidate_id = "Y"

note right of Redis
  alert-state now genuinely holds
  candidate Y's claim.
end note

group MULTI / EXEC - - built from the STALE snapshot above
  PC -> Redis : HSET recent-loss\ncomposite_claim_candidate_id = ""  (* stale *)
  PC -> Redis : DEL alert-state
end
Redis - -> PC : done

note over Redis
  recent-loss now exists with
  composite_claim_candidate_id = ""
  Candidate Y's claim, written AFTER
  the HGETALL but BEFORE the MULTI,
  is gone - - lost, not merely delayed.
end note

@enduml

