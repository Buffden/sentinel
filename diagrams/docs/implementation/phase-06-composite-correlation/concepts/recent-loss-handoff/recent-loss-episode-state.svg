 y1="274.1566" y2="274.1566"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="52.9102" x="102.72" y="266.2034">RECENT</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="20" id="ent0011"><path d="M430.92,43.4883 L430.92,75.1083 L395.81,79.1083 L430.92,83.1083 L430.92,114.7305 A0,0 0 0 0 430.92,114.7305 L685.4249,114.7305 A0,0 0 0 0 685.4249,114.7305 L685.4249,53.4883 L675.4249,43.4883 L430.92,43.4883 A0,0 0 0 0 430.92,43.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M675.4249,43.4883 L675.4249,53.4883 L685.4249,53.4883 L675.4249,43.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="133.25" x="436.92" y="61.0566">alert-state:{entity_id}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="233.5049" x="436.92" y="76.3672">No TTL. Anchored by dark_since_ms.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225.3926" x="436.92" y="91.6777">composite_issued = '0' reserved for</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.7695" x="436.92" y="106.9883">Phase 06 composite correlation.</text></g><g class="entity" data-qualified-name="GMN13" data-source-line="27" id="ent0014"><path d="M200.22,221.7283 L200.22,268.6683 L166.04,272.6683 L200.22,276.6683 L200.22,323.5916 A0,0 0 0 0 200.22,323.5916 L524.1302,323.5916 A0,0 0 0 0 524.1302,323.5916 L524.1302,231.7283 L514.1302,221.7283 L200.22,221.7283 A0,0 0 0 0 200.22,221.7283" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M514.1302,221.7283 L514.1302,231.7283 L524.1302,231.7283 L514.1302,221.7283" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="138.5059" x="206.22" y="239.2966">recent-loss:{entity_id}</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.9102" x="206.22" y="254.6072">TTL = COMPOSITE_CORRELATION_WINDOW_MS,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="192.2515" x="206.22" y="269.9177">counted from resumed_at_ms.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="261.8916" x="206.22" y="285.2283">This is retention only &#8212; actual composite</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.3452" x="206.22" y="300.5388">eligibility is a separate source-time check</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.1592" x="206.22" y="315.8494">(see correlation-window-semantics).</text></g><g class="entity" data-qualified-name="GMN16" data-source-line="36" id="ent0017"><path d="M303.53,541.5983 L303.53,612.8405 A0,0 0 0 0 303.53,612.8405 L626.8181,612.8405 A0,0 0 0 0 626.8181,612.8405 L626.8181,551.5983 L616.8181,541.5983 L469.18,541.5983 L465.18,481.0883 L461.18,541.5983 L303.53,541.5983 A0,0 0 0 0 303.53,541.5983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M616.8181,541.5983 L616.8181,551.5983 L626.8181,551.5983 L616.8181,541.5983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221.6094" x="309.53" y="559.1666">No Redis key exists for this entity's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.2363" x="309.53" y="574.4772">signal-loss state. A future silence opens</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1353" x="309.53" y="589.7877">a brand new ACTIVE episode with a new</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302.2881" x="309.53" y="605.0983">dark_since_ms and a new deterministic alert_id.</text></g><!--link *start* to NO_EPISODE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk3"><path d="M899.11,281.9883 C893.29,293.0583 881.58,312.4983 866.18,323.5983 C757.29,402.0583 603.7614,434.5547 522.4814,447.1147" fill="none" id="*start*-to-NO_EPISODE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="517.54,447.8783,527.0453,450.4569,522.4814,447.1147,525.8236,442.5508,517.54,447.8783" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link NO_EPISODE to ACTIVE--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk5"><path d="M517.62,441.1783 C538.35,433.0283 560.07,420.2683 572.18,400.5983 C601.98,352.1783 608.46,188.5083 572.18,144.7283 C526.28,89.3683 479.77,141.8683 413.18,114.7283 C406.55,112.0283 404.1291,111.0536 397.8891,107.1836" fill="none" id="NO_EPISODE-to-ACTIVE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="393.64,104.5483,399.1802,112.6911,397.8891,107.1836,403.3967,105.8925,393.64,104.5483" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="174.8271" x="642.1013" y="262.7366">Alert Evaluator scan detects</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="262.9897" x="598.02" y="278.0472">silence &gt;= SIGNAL_LOSS_THRESHOLD_MS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.9473" x="634.5412" y="293.3577">(alert-state:{entity_id} written)</text></g><!--link ACTIVE to RECENT--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="13" id="lnk7"><path d="M327.34,104.4783 C311.08,116.3783 291.42,131.0483 274.18,144.7283 C232.67,177.6583 222.86,186.6283 183.18,221.7283 C173.9,229.9383 167.5637,235.6957 158.7237,243.9057" fill="none" id="ACTIVE-to-RECENT" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="155.06,247.3083,164.3767,244.1146,158.7237,243.9057,158.9326,238.2527,155.06,247.3083" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="92.9614" x="374.8223" y="158.2966">entity resumes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.3394" x="336.1334" y="173.6072">(Position Consumer MULTI:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.2461" x="275.18" y="188.9177">HSET recent-loss + PEXPIRE + DEL alert-state)</text></g><!--link RECENT to NO_EPISODE--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="15" id="lnk8"><path d="M92.33,296.6183 C54.77,322.7883 6,366.3783 36.18,400.5983 C60.76,428.4683 298.9483,445.2396 407.8883,451.5396" fill="none" id="RECENT-to-NO_EPISODE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="412.88,451.8283,404.1259,447.3154,407.8883,451.5396,403.6641,455.302,412.88,451.8283" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.8643" x="37.18" y="367.1666">COMPOSITE_CORRELATION_WINDOW_MS</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="172.98" x="79.1221" y="382.4772">elapses &#8212; Redis TTL expiry</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.4492" x="64.8875" y="397.7877">(retention bound, not eligibility)</text></g><!--link RECENT to NO_EPISODE--><g class="link" data-entity-1="ent0006" data-entity-2="ent0002" data-link-type="dependency" data-source-line="17" id="lnk9"><path d="M150.58,298.0583 C159.79,307.2383 171.19,317.0383 183.18,323.5983 C229.51,348.9583 254.17,324.3783 298.18,353.5983 C320.1,368.1483 313.3,384.5883 334.18,400.5983 C357.41,418.4083 382.6217,429.7025 408.0117,438.4325" fill="none" id="RECENT-to-NO_EPISODE-1" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="412.74,440.0583,405.5297,433.3493,408.0117,438.4325,402.9284,440.9146,412.74,440.0583" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.3198" x="358.6441" y="367.1666">entity goes dark again before</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="232.248" x="335.18" y="382.4772">recent-loss expires &#8212; a NEW ACTIVE</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.1992" x="358.7044" y="397.7877">episode opens independently</text></g><?plantuml-src XLJjQjim5FtlfxYm7qstkdICVL1e8KlKrSo9G-ojWsKOnRvDH6mfI7BJC0PxY3tXdcHNYalSb6rEViZMaSwvvrp92biXf68XUHN6oXXWQs5KYV3xvo-OOYaCVCGjf9PRXDvWyl8u2CnAo3NNl0RZFhzNkaGzK9NIyEorVvv0UB5QQDN8ieLTlNE_GrXVQxLf4Q_yqq58TK3LzyyXuWdJrTMGlGs2hy-_GHXUmZZ9sIHAao4BWltOJ_K7MVIPmJdqAzGMs1sl6cvf4rDm2ILQBAoPIICgb0N2vGMaqOTnFyxZ94tpx7hAqkia7kQZT2PxtEqH-hBElwEqmcvpKVw0ZHRMeYGRMph7F6K3Diw8UGS4ZQQfaRXw4sM45Kh2G4dtJSFeKvn5vpDvdRACW0Kj2IkNt0kOi2-JQCfeD6GnT1GGMqlns09Y72IZIP966Si7oNJAuduM9UFy9XeFanjV2LPyRT1q6YBBOi3xjT1R4gZ95kaLpfth9ou5m4ein5nKLCi_gDjY5ufsBxbU0LzmGVlWhT8uaztQF5qhWiEOtRHXaRosNzKQfG4XIwH1IGkhRH2uZW0j5aiBwhPT4W3y9HkQ6IjNtIdqPR4a4INCjrvQRWH5djVcb425gjSk5io5CGs1Bk3exCY5XlgENaa-eIPBRX3EtkpXDDAQx7HkdGQaqdVieSgTMxH1f_u