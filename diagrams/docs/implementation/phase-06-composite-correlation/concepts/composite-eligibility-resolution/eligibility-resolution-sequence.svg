.4199">this yet -- claiming and emitting are</text><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="196" x="95" y="586.3887">separate, later checkpoints.</text><line style="stroke: #A80036; stroke-width: 1.5;" x1="84.5" x2="126.5" y1="623.1875" y2="623.1875"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="126.5" x2="126.5" y1="623.1875" y2="636.1875"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="85.5" x2="126.5" y1="636.1875" y2="636.1875"/><polygon fill="#A80036" points="95.5,632.1875,85.5,636.1875,95.5,640.1875,91.5,636.1875" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="monospace" font-size="12" lengthAdjust="spacingAndGlyphs" textLength="147" x="91.5" y="618.3574">return winner or null</text><!--MD5=[e960817effb2e07744d2f4a1e811a278]
@startuml eligibility-resolution-sequence
title resolveCompositeEligibility — Read-Only Resolution (CP2)

skinparam defaultFontName Monospaced
skinparam defaultFontSize 12
skinparam sequenceArrowThickness 1.5
skinparam sequenceParticipantBorderColor #888888
skinparam sequenceLifeLineBorderColor #AAAAAA
skinparam noteBorderColor #AAAAAA
skinparam noteBackgroundColor #FAFAFA
skinparam sequenceGroupBorderColor #CCCCCC
skinparam sequenceGroupBodyBackgroundColor #FAFAFA

participant "Alert Evaluator\n(composite.ts)" as CE #DBEAFE
participant "Redis" as Redis #FEF9C3

CE -> CE : resolveCompositeEligibility(\n  redis, entityAId, entityBId,\n  episodeStartMs, windowMs)

par entity A
  CE -> Redis : HGETALL alert-state:{entityAId}
  Redis - -> CE : fields (or empty)
  CE -> Redis : HGETALL recent-loss:{entityAId}\n(only if alert-state absent)
  Redis - -> CE : fields (or empty)
else entity B
  CE -> Redis : HGETALL alert-state:{entityBId}
  Redis - -> CE : fields (or empty)
  CE -> Redis : HGETALL recent-loss:{entityBId}\n(only if alert-state absent)
  Redis - -> CE : fields (or empty)
end

CE -> CE : selectWinningEpisode(a, b)\n- - pure, no Redis, no Kafka

note right of CE
  No HSET, no PEXPIRE, no DEL, no producer.send.
  Returns QualifyingLossEpisode | null.
  handleProximityCandidate is not wired to
  this yet - - claiming and emitting are
  separate, later checkpoints.
end note

CE -> CE : return winner or null

@enduml

