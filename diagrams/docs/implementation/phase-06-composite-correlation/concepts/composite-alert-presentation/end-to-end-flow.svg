<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="586px" preserveAspectRatio="none" style="width:429px;height:586px;background:#FFFFFF;" version="1.1" viewBox="0 0 429 586" width="429px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="monospace" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="387.7207" x="20" y="32.9951">From&#160;a&#160;quiet&#160;aircraft&#160;to&#160;a&#160;card&#160;on&#160;your&#160;screen</text></g><ellipse cx="212.8604" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="293.9331" x="65.8938" y="92.2969"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="211.3198" x="75.8938" y="114.3638">An&#160;aircraft&#160;goes&#160;quiet,&#160;and</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="273.9331" x="75.8938" y="129.4966">something&#160;unexpected&#160;happens&#160;nearby</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="270.4531" x="77.6338" y="162.5625"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="87.6338" y="184.6294">The&#160;system&#160;notices&#160;both&#160;facts</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="250.4531" x="87.6338" y="199.7622">and&#160;decides&#160;they're&#160;one&#160;incident</text><rect fill="#F5F5F5" height="65.3984" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="246.9731" x="89.3738" y="232.8281"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="99.3738" y="254.895">It&#160;writes&#160;one&#160;combined&#160;alert,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="99.3738" y="270.0278">and&#160;a&#160;note&#160;that&#160;the&#160;old&#160;alert</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="117.3999" x="99.3738" y="285.1606">is&#160;now&#160;replaced</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="270.4531" x="77.6338" y="318.2266"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="87.6338" y="340.2935">That&#160;gets&#160;saved&#160;to&#160;the&#160;database</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="250.4531" x="87.6338" y="355.4263">as&#160;a&#160;single,&#160;all-or-nothing&#160;step</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="223.4932" x="101.1138" y="388.4922"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="111.1138" y="410.5591">Every&#160;connected&#160;dashboard</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="111.1138" y="425.6919">is&#160;told&#160;about&#160;both&#160;changes</text><rect fill="#F5F5F5" height="65.3984" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="278.2798" x="73.7205" y="458.7578"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="258.2798" x="83.7205" y="480.8247">The&#160;alert&#160;list&#160;on&#160;screen&#160;redraws:</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="83.7205" y="495.9575">one&#160;combined&#160;card,&#160;the&#160;old</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="203.4932" x="83.7205" y="511.0903">alert&#160;tucked&#160;underneath&#160;it</text><ellipse cx="212.8604" cy="555.1563" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="212.8604" cy="555.1563" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="72.2969" y2="92.2969"/><polygon fill="#555555" points="208.8604,82.2969,212.8604,92.2969,216.8604,82.2969,212.8604,86.2969" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="142.5625" y2="162.5625"/><polygon fill="#555555" points="208.8604,152.5625,212.8604,162.5625,216.8604,152.5625,212.8604,156.5625" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="212.8281" y2="232.8281"/><polygon fill="#555555" points="208.8604,222.8281,212.8604,232.8281,216.8604,222.8281,212.8604,226.8281" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="298.2266" y2="318.2266"/><polygon fill="#555555" points="208.8604,308.2266,212.8604,318.2266,216.8604,308.2266,212.8604,312.2266" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="368.4922" y2="388.4922"/><polygon fill="#555555" points="208.8604,378.4922,212.8604,388.4922,216.8604,378.4922,212.8604,382.4922" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="212.8604" x2="212.8604" y1="438.7578" y2="458.7578"/><polygon fill="#555555" points="208.8604,448.7578,212.8604,458.7578,216.8604,448.