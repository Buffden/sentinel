<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="575px" preserveAspectRatio="none" style="width:713px;height:575px;background:#FFFFFF;" version="1.1" viewBox="0 0 713 575" width="713px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="monospace" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="244.4326" x="233.3701" y="32.9951">Either&#160;order,&#160;same&#160;end&#160;result</text></g><ellipse cx="292.8865" cy="62.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="555.7729" x="16" y="92.2969"/><rect fill="#F5F5F5" height="35.1328" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="239.1465" x="28" y="118.2969"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="219.1465" x="38" y="140.3638">Combined&#160;alert&#160;arrives&#160;first</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="215.6665" x="39.74" y="180.9961"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="49.74" y="203.063">Shows&#160;on&#160;screen&#160;by&#160;itself</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="164.3599" x="49.74" y="218.1958">(nothing&#160;to&#160;nest&#160;yet)</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="215.6665" x="39.74" y="258.8281"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="49.74" y="280.895">"Went&#160;dark"&#160;alert&#160;arrives</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="49.74" y="296.0278">a&#160;moment&#160;later</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="176.5332" x="59.3066" y="336.6602"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="156.5332" x="69.3066" y="358.7271">Now&#160;nests&#160;underneath</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="140.8799" x="69.3066" y="373.8599">the&#160;combined&#160;alert</text><rect fill="#F5F5F5" height="35.1328" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="262.6265" x="295.1465" y="125.8633"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="305.1465" y="147.9302">"Went&#160;dark"&#160;alert&#160;arrives&#160;first</text><rect fill="#F5F5F5" height="35.1328" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="262.6265" x="295.1465" y="188.5625"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="305.1465" y="210.6294">Shows&#160;on&#160;screen&#160;as&#160;its&#160;own&#160;card</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="192.1865" x="330.3665" y="251.2617"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="172.1865" x="340.3665" y="273.3286">Combined&#160;alert&#160;arrives</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="109.5732" x="340.3665" y="288.4614">a&#160;moment&#160;later</text><rect fill="#F5F5F5" height="50.2656" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="262.6265" x="295.1465" y="329.0938"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="305.1465" y="351.1606">"Went&#160;dark"&#160;alert&#160;immediately</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="305.1465" y="366.2935">moves&#160;under&#160;it,&#160;marked&#160;replaced</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="555.7729" x="16" y="406.9258"/><path d="M428.5464,437.9258 L428.5464,469.1914 L408.5464,473.1914 L428.5464,477.1914 L428.5464,508.457 A0,0 0 0 0 428.5464,508.457 L692.1729,508.457 A0,0 0 0 0 692.1729,508.457 L692.1729,447.9258 L682.1729,437.9258 L428.5464,437.9258 A0,0 0 0 0 428.5464,437.9258" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M682.1729,437.9258 L682.1729,447.9258 L692.1729,447.9258 L682.1729,437.9258" fill="#FAFAFA" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="434.5464" y="454.9927">Whichever&#160;of&#160;the&#160;two&#160;alerts&#160;the</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="226.9731" x="434.5464" y="470.1255">system&#160;hears&#160;about&#160;first,&#160;the</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="242.6265" x="434.5464" y="485.2583">operator&#160;ends&#160;up&#160;looking&#160;at&#160;the</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="211.3198" x="434.5464" y="500.3911">identical,&#160;correct&#160;picture.</text><rect fill="#F5F5F5" height="80.5313" rx="12.5" ry="12.5" style="stroke:#888888;stroke-width:0.5;" width="231.3198" x="177.2266" y="432.9258"/><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="211.3198" x="187.2266" y="454.9927">Same&#160;end&#160;result&#160;either&#160;way:</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="187.8398" x="187.2266" y="470.1255">one&#160;combined&#160;alert&#160;card,</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="195.6665" x="187.2266" y="485.2583">the&#160;replaced&#160;alert&#160;nested</text><text fill="#000000" font-family="monospace" font-size="13" lengthAdjust="spacing" textLength="101.7466" x="187.2266" y="500.3911">underneath&#160;it</text><ellipse cx="292.8865" cy="544.457" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="292.8865" cy="544.457" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#555555;stroke-width:1;" x1="147.5732" x2="147.5732" y1="153.4297" y2="180.9961"/><polygon fill="#555555" points="143.5732,170.9961,147.5732,180.9961,151.5732,170.9961,147.5732,174.9961" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="147.5732" x2="147.5732" y1="231.2617" y2="258.8281"/><polygon fill="#555555" points="143.5732,248.8281,147.5732,258.8281,151.5732,248.8281,147.5732,252.8281" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="147.5732" x2="147.5732" y1="309.0938" y2="336.6602"/><polygon fill="#555555" points="143.5732,326.6602,147.5732,336.6602,151.5732,326.6602,147.5732,330.6602" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="426.4597" x2="426.4597" y1="160.9961" y2="188.5625"/><polygon fill="#555555" points="422.4597,178.5625,426.4597,188.5625,430.4597,178.5625,426.4597,182.5625" style="stroke:#555555;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#555555;stroke-width:1;" x1="426.4597" x2="426.4597" y1="223.6953" y2="251.2617"/><polygon fill="#555555" points="422.4597,241.2617,426.4597,251.2617,430.4597,241.2617,426.4597,245.2617" style="stroke:#5