<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="613px" preserveAspectRatio="none" style="width:838px;height:613px;background:#FFFFFF;" version="1.1" viewBox="0 0 838 613" width="838px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="362.25" x="234.5704" y="23.5352">Candidate Consumer Session Lifecycle (Pre-CP2A)</text></g><g class="start_entity" data-qualified-name=".start." data-source-line="9" id="ent0001"><ellipse cx="451.18" cy="257.6683" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/></g><g class="entity" data-qualified-name="NO_SESSION" data-source-line="9" id="ent0002"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="103.6787" x="344.34" y="400.5983"/><line style="stroke:#555555;stroke-width:0.5;" x1="344.34" x2="448.0187" y1="427.0866" y2="427.0866"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83.6787" x="354.34" y="419.1334">NO_SESSION</text></g><g class="entity" data-qualified-name="JOINING" data-source-line="11" id="ent0004"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="74.0996" x="555.13" y="545.5583"/><line style="stroke:#555555;stroke-width:0.5;" x1="555.13" x2="629.2296" y1="572.0466" y2="572.0466"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="54.0996" x="565.13" y="564.0934">JOINING</text></g><g class="entity" data-qualified-name="ACTIVE" data-source-line="13" id="ent0006"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="68.9727" x="317.69" y="54.1083"/><line style="stroke:#555555;stroke-width:0.5;" x1="317.69" x2="386.6627" y1="80.5966" y2="80.5966"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="48.9727" x="327.69" y="72.6434">ACTIVE</text></g><g class="entity" data-qualified-name="LEAVING" data-source-line="15" id="ent0008"><rect fill="#F8F8F8" height="50" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="78.3584" x="7" y="232.6683"/><line style="stroke:#555555;stroke-width:0.5;" x1="7" x2="85.3584" y1="259.1566" y2="259.1566"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="58.3584" x="17" y="251.2034">LEAVING</text></g><g class="entity" data-qualified-name="GMN11" data-source-line="20" id="ent0012"><path d="M421.58,43.4883 L421.58,75.1083 L386.9,79.1083 L421.58,83.1083 L421.58,114.7305 A0,0 0 0 0 421.58,114.7305 L686.787,114.7305 A0,0 0 0 0 686.787,114.7305 L686.787,53.4883 L676.787,43.4883 L421.58,43.4883 A0,0 0 0 0 421.58,43.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M676.787,43.4883 L676.787,53.4883 L686.787,53.4883 L676.787,43.4883" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="180.1528" x="427.58" y="61.0566">Scan loop runs concurrently.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8389" x="427.58" y="76.3672">activeSession / activeSessionAbort</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.207" x="427.58" y="91.6777">are set at module scope so shutdown()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="186.3545" x="427.58" y="106.9883">can reach this term's session.</text></g><g class="entity" data-qualified-name="GMN14" data-source-line="27" id="ent0015"><path d="M120.46,206.7383 L120.46,253.6683 L85.6,257.6683 L120.46,261.6683 L120.46,308.6016 A0,0 0 0 0 120.46,308.6016 L405.897,308.6016 A0,0 0 0 0 405.897,308.6016 L405.897,216.7383 L395.897,206.7383 L120.46,206.7383 A0,0 0 0 0 120.46,206.7383" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M395.897,206.7383 L395.897,216.7383 L405.897,216.7383 L395.897,206.7383" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.3262" x="126.46" y="224.3066">stop() is idempotent: the lease-loss</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="240.4302" x="126.46" y="239.6172">callback, this session's own teardown,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="236.8374" x="126.46" y="254.9277">and shutdown() may all call it without</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.2422" x="126.46" y="270.2383">coordinating who goes first -- every</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.437" x="126.46" y="285.5488">caller converges on the same disconnect()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="185.7705" x="126.46" y="300.8594">promise, never a second one.</text></g><g class="entity" data-qualified-name="GMN17" data-source-line="36" id="ent0018"><path d="M256.39,542.5983 L256.39,598.5299 A0,0 0 0 0 256.39,598.5299 L481.9686,598.5299 A0,0 0 0 0 481.9686,598.5299 L481.9686,552.5983 L471.9686,542.5983 L378.34,542.5983 L391.6,450.8483 L370.34,542.5983 L256.39,542.5983 A0,0 0 0 0 256.39,542.5983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M471.9686,542.5983 L471.9686,552.5983 L481.9686,552.5983 L471.9686,542.5983" fill="#FFFDE7" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="204.5786" x="262.39" y="560.1666">A follower never enters JOINING.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="202.6299" x="262.39" y="575.4772">Only a lease acquisition attempt</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="141.1719" x="262.39" y="590.7877">can start this lifecycle.</text></g><!--link *start* to NO_SESSION--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="9" id="lnk3"><path d="M447.63,267.4583 C441.77,282.0983 429.88,312.4383 421.18,338.5983 C414.31,359.2483 408.8109,378.2187 404.0309,395.5287" fill="none" id="*start*-to-NO_SESSION" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="402.7,400.3483,408.9513,392.7377,404.0309,395.5287,401.2399,390.6083,402.7,400.3483" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="164.9312" x="422.18" y="359.6666">instance starts as follower</text></g><!--link NO_SESSION to JOINING--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="11" id="lnk5"><path d="M398.2,450.7783 C401.04,469.9083 407.85,496.0683 424.18,512.5983 C433.62,522.1583 503.4528,543.7388 550.0128,557.4188" fill="none" id="NO_SESSION-to-JOINING" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="554.81,558.8283,547.3026,552.4534,550.0128,557.4188,545.0474,560.129,554.81,558.8283" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178.0835" x="425.18" y="494.1666">leader.tryAcquire() succeeds</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165.4136" x="431.515" y="509.4772">runLeaderSession() begins</text></g><!--link JOINING to ACTIVE--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" data-link-type="dependency" data-source-line="13" id="lnk7"><path d="M600.61,545.1983 C603.64,535.2283 606.68,523.4883 608.18,512.5983 C618.78,435.6183 622.09,409.8883 591.18,338.5983 C546.08,234.5783 444.8421,148.5988 390.3021,107.4688" fill="none" id="JOINING-to-ACTIVE" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="386.31,104.4583,391.0873,113.0709,390.3021,107.4688,395.9042,106.6836,386.31,104.4583" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="212.7036" x="607.1386" y="352.1666">startCandidateConsumerSession()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217.8008" x="604.59" y="367.4772">connect + subscribe + run resolve</text></g><!--link ACTIVE to LEAVING--><g class="link" data-entity-1="ent0006" data-entity-2="ent0008" data-link-type="dependency" data-source-line="15" id="lnk9"><path d="M317.25,94.5583 C267.65,115.7983 174.87,158.2183 103.18,206.7383 C92.07,214.2583 84.4711,220.3575 74.8911,229.0075" fill="none" id="ACTIVE-to-LEAVING" style="stroke:#333333;stroke-width:1;"/><polygon fill="#333333" points="71.18,232.3583,80.5406,229.2957,74.8911,229.0075,75.1793,223.358,71.18,232.3583" style="stroke:#333333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="209.0347" x="210" y="158.3066">lease lost (renewal Lua returns 0)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="154.4067" x="237.314" y="173.6172">OR SIGTERM/shutdown()</text></g><!--link LEAVING to NO_SESSION--><g class="link" data-entity-1="ent0008" data-entity-2="ent0002" data-link-type="dependen